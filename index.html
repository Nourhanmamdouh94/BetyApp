<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1: عشان الآيفون ميعملش زووم لما تدوسي على خانة كتابة -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>دفتر البيت</title>
<meta name="theme-color" content="#6260DC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر البيت">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   دفتر البيت — Design System (الشرح في DESIGN-SYSTEM.md)

   ٣ طبقات Variables زي Figma:
   ١) Primitives  — الدرجات الخام (teal-50 … teal-900)
   ٢) Semantic    — الاستخدام العام (--ink, --brand …)
   ٣) Component   — لكل component (--btn-primary-bg, --chip-bg …)
   + Category     — كل قسم بيحط درجاته في --cat-50 … --cat-900

   منطق الألوان:
   - لون القسم  = هوية المهمة
   - البترولي   = الأكشن والهيدر
   - البينك     = دلوقتي ومهم
   ========================================================= */
:root{
  color-scheme: light;

  /* =====================================================
     ١) Primitives — من ٥٠ لـ ٩٠٠ (OKLCH)
     ===================================================== */
  --white: #FFFFFF;
  /* المحايد — رمادي بارد لحد الكحلي الغامق */
  --neutral-50:#F7F7F9; --neutral-100:#EEF0F6; --neutral-200:#DEDFE5; --neutral-300:#C9CAD0; --neutral-400:#A9AAB0;
  --neutral-500:#878991; --neutral-600:#6A6B73; --neutral-700:#505259; --neutral-800:#36383E; --neutral-900:#1C1C24;
  /* الأساسي — إنديجو (من ريفرنس الهيدر) */
  --indigo-50:#F5F5FE; --indigo-100:#EFF0FC; --indigo-200:#D9DBFB; --indigo-300:#B4B6F5; --indigo-400:#7476E7;
  --indigo-500:#6260DC; --indigo-600:#4C4DDB; --indigo-700:#393BD3; --indigo-800:#2D2BA0; --indigo-900:#211E6B;
  /* الخطأ والمسح */
  --red-50:#FFF7F6; --red-100:#FEEBE9; --red-200:#FED4D0; --red-300:#FEB5AF; --red-400:#FF8A83;
  --red-500:#F35B58; --red-600:#D64545; --red-700:#AE2D30; --red-800:#8A1F22; --red-900:#681215;
  /* الأكسنت — بينك (دلوقتي، والكارت المهم، والـ nav) */
  --pink-50:#FFF3F9; --pink-100:#FFE4F3; --pink-200:#F5BCDD; --pink-300:#F9A6D8; --pink-400:#E47CBD;
  --pink-500:#C955A0; --pink-600:#A83B84; --pink-700:#892A6A; --pink-800:#691B51; --pink-900:#4C0D39;
  /* قسم التنظيف — أخضر ليموني */
  --lime-50:#F5F9EC; --lime-100:#E9F1D5; --lime-200:#CCDE92; --lime-300:#BBCF77; --lime-400:#9AB133;
  --lime-500:#7D9201; --lime-600:#647505; --lime-700:#4F5D04; --lime-800:#3B4602; --lime-900:#283001;
  /* قسم المطبخ — أصفر زبدة */
  --butter-50:#FAF7EA; --butter-100:#F5EDD1; --butter-200:#F5D86F; --butter-300:#DCC367; --butter-400:#C3A200;
  --butter-500:#9F8405; --butter-600:#806A05; --butter-700:#665400; --butter-800:#4D3E00; --butter-900:#352A00;
  /* قسم المشتريات — أزرق بيريونكل */
  --periwinkle-50:#F3F7FE; --periwinkle-100:#E4EDFF; --periwinkle-200:#B7CAED; --periwinkle-300:#A6C5FD; --periwinkle-400:#7FA4EB;
  --periwinkle-500:#5C84D2; --periwinkle-600:#4569B2; --periwinkle-700:#335391; --periwinkle-800:#243D71; --periwinkle-900:#152952;
  /* قسم التنظيم — لافندر */
  --lavender-50:#F7F5FE; --lavender-100:#EDEAFC; --lavender-200:#DFD9FB; --lavender-300:#C6BBF1; --lavender-400:#A799DC;
  --lavender-500:#8A78C2; --lavender-600:#6F5FA3; --lavender-700:#584A85; --lavender-800:#423667; --lavender-900:#2D234A;
  /* قسم الفواتير والتنبيه — خوخي */
  --peach-50:#FFF5ED; --peach-100:#FFE8D6; --peach-200:#F8CBA6; --peach-300:#FAB375; --peach-400:#E68C31;
  --peach-500:#C26E05; --peach-600:#9D5803; --peach-700:#7D4503; --peach-800:#5F3302; --peach-900:#422201;

  /* =====================================================
     ٢) Semantic — الاستخدام العام
     ===================================================== */
  --bg:        var(--white);    /* خلفية الشاشة — ٦٠٪ من الشاشة */

  /* Elevation — الظل اللي بيفصل الكروت عن الخلفية */
  --elev-1: 0 1px 2px color-mix(in srgb, var(--neutral-900) 6%, transparent), 0 4px 14px color-mix(in srgb, var(--neutral-900) 6%, transparent);
  --elev-2: 0 2px 4px color-mix(in srgb, var(--neutral-900) 6%, transparent), 0 10px 28px color-mix(in srgb, var(--neutral-900) 10%, transparent);
  --stroke: var(--white);     /* حد رفيع حوالين الكروت البيضا */
  --surface:   var(--neutral-50);         /* سطح الكروت */
  --surface-2: var(--neutral-50);    /* سطح تاني (الـ Sheet) */
  --line:      var(--neutral-200);   /* الحدود */
  --ink:       var(--neutral-900);   /* النص الأساسي */
  --muted:     var(--neutral-700);   /* النص الثانوي */
  --brand:     var(--indigo-600);      /* الأكشن والهيدر */
  --accent:    var(--indigo-500);      /* دلوقتي ومهم */
  --danger:    var(--red-600);

  /* الخط — أكبر مقاس 14px */
  --font: -apple-system, "SF Arabic", BlinkMacSystemFont, "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;   /* SF Arabic على الآيفون، وNoto Sans Arabic على أي جهاز تاني */
  --fs-title: 14px; --fs-body: 13px; --fs-meta: 12px;
  /* أوزان الخط: medium هو الأساسي، و semibold للعناوين بس */
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;

  /* الحواف والمسافات */
  /* الحواف: 12 للعناصر العادية، 8 للصغيرة، 4 للأصغر — والدواير بتفضل دواير */
  --r-lg: 12px; --r-md: 8px; --r-sm: 4px; --r-xl: 12px; --r-pill: 99px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --gutter: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* =====================================================
     ٣) Component tokens
     ===================================================== */
  /* Button */
  --btn-radius: var(--r-lg);
  --btn-h-sm: 32px; --btn-h-md: 40px; --btn-h-lg: 52px;
  --btn-px-sm: 12px; --btn-px-md: 18px;
  --btn-primary-bg: var(--indigo-600);  --btn-primary-bg-pressed: var(--indigo-700); --btn-primary-fg: var(--white);
  --btn-secondary-bg: var(--white);    --btn-secondary-border: var(--indigo-200);   --btn-secondary-fg: var(--indigo-600);
  --btn-soft-bg: var(--white);       --btn-soft-fg: var(--indigo-600);
  --btn-text-fg: var(--indigo-600);
  --btn-danger-fg: var(--red-600);
  --btn-destructive-bg: var(--white);  --btn-destructive-border: var(--red-200);  --btn-destructive-fg: var(--red-600);   /* زرار مسح ثانوي */
  --btn-destructive-solid-bg: var(--red-600); --btn-destructive-solid-fg: var(--white);                                  /* زرار التأكيد في الرسالة */
  --dialog-bg: var(--white); --dialog-radius: 16px; --dialog-shadow: 0 20px 48px color-mix(in srgb, var(--neutral-900) 22%, transparent); --dialog-title-fg: var(--ink); --dialog-msg-fg: var(--muted);
  --btn-disabled-opacity: .4;

  /* Icon button */
  --icon-btn-size: 40px; --icon-btn-size-sm: 32px;
  --icon-btn-on-brand-bg: var(--lavender-700); --icon-btn-on-brand-fg: var(--lavender-50);
  --icon-btn-surface-bg: var(--white);     --icon-btn-surface-fg: var(--neutral-800); --icon-btn-surface-shadow: var(--elev-1);
  --icon-btn-accent-bg: var(--indigo-50);   --icon-btn-accent-fg: var(--indigo-600);
  --icon-btn-primary-bg: var(--indigo-600);  --icon-btn-primary-fg: var(--white);
  --badge-dot: var(--peach-400);

  /* Check (زرار الإنجاز) */
  --check-size: 20px;
  --check-border: var(--neutral-300);   /* الدايرة الفاضية: رمادي فاتح */
  --check-done-bg: var(--indigo-600);   /* لون واحد لكل المهام اللي خلصت */

  /* Chip */
  /* الـ Chip مش زرار: أصغر، على قد الكلام، خفيف، والـ selected لون فاتح + علامة صح (مش لون مليان زي الـ primary) */
  --chip-h: 32px; --chip-px: 12px; --chip-radius: var(--r-md); --chip-gap: 8px; --chip-weight: var(--fw-medium);
  --chip-bg: var(--neutral-50);            --chip-fg: var(--neutral-700);      --chip-border: var(--neutral-200);   --chip-bg-pressed: var(--neutral-100);   /* default */
  --chip-bg-selected: var(--indigo-50);    --chip-fg-selected: var(--indigo-700); --chip-border-selected: var(--indigo-300);                           /* selected */
  --chip-bg-disabled: transparent;         --chip-fg-disabled: var(--neutral-400); --chip-border-disabled: var(--neutral-300); --chip-disabled-selected-opacity: .5;   /* disabled */
  --chip-count-fg: var(--neutral-500);   --chip-count-fg-selected: var(--indigo-500);
  --chip-icon-bg: transparent; --chip-icon-fg: var(--cat-700, var(--neutral-800));   /* الأيقونات Line art من غير خلفية */

  /* Segmented */
  --seg-bg: var(--neutral-100); --seg-fg: var(--neutral-700);
  --seg-bg-selected: var(--white); --seg-fg-selected: var(--indigo-600);

  /* Tag */
  --tag-h: 22px;
  --tag-bg: var(--neutral-100);  --tag-fg: var(--neutral-700);
  --tag-accent-bg: var(--indigo-50); --tag-accent-fg: var(--indigo-700);
  --tag-brand-bg: var(--indigo-100);  --tag-brand-fg: var(--indigo-700);
  /* الإلحاح: كل ما الميعاد يقرب اللون يسخن */
  --tag-urgent-bg: var(--red-100);   --tag-urgent-fg: var(--red-700);    /* النهارده وبكرة */
  --tag-soon-bg: var(--peach-100);    --tag-soon-fg: var(--peach-700);     /* خلال ٢–٤ أيام */
  --tag-later-bg: var(--lavender-50);    --tag-later-fg: var(--lavender-700);    /* ٥ أيام أو أكتر */
  --tag-done-bg: var(--lime-100);     --tag-done-fg: var(--lime-800);        /* اتقنتها */

  /* List item (صف المهمة) */
  --li-radius: var(--r-lg); --li-min-h: 58px;
  --li-bg: var(--surface);
  --li-border: var(--stroke);
  --li-shadow: none;
  --li-title-fg: var(--neutral-900);
  --li-meta-fg: var(--cat-700, var(--neutral-700));
  --li-icon-bg: transparent;
  --li-icon-fg: var(--cat-700, var(--neutral-800));
  --li-done-bg: var(--white);    /* المهمة اللي خلصت: disabled */
  --li-done-fg: var(--neutral-600);
  --li-done-opacity: .6;

  /* Tile (كارت القسم) */
  --tile-radius: var(--r-lg);
  --tile-cols: 3; --tile-min-h: 104px; --tile-ill-size: 46px; --tile-count-size: 24px;
  --tile-bg: var(--cat-100);
  --tile-title-fg: var(--cat-900);
  --tile-sub-fg: var(--cat-800);
  --tile-count-bg: var(--white);  --tile-count-fg: var(--cat-800);
  --tile-border: var(--cat-200);
  --tile-border-selected: var(--neutral-900);

  /* Card (كروت «قريب») */
  --card-radius: var(--r-lg);
  --card-bg: var(--surface);
  --card-border: var(--stroke);
  --card-shadow: none;
  --card-title-fg: var(--ink);
  --card-icon-bg: transparent;  --card-icon-fg: var(--cat-700, var(--neutral-800));

  /* Hero، والهيدر، والتقويم، والفلوس، والطبخ، والإعدادات */
  --hero-bg: linear-gradient(180deg, var(--indigo-500) 0%, var(--indigo-700) 100%); --hero-fg: var(--white); --hero-fg-2: color-mix(in srgb, var(--white) 82%, transparent); --hero-radius: 0px;
  --hero-avatar-bg: var(--white); --hero-avatar-fg: var(--indigo-600);
  --today-card-bg: var(--indigo-50); --today-card-fg: var(--neutral-900); --today-card-fg-2: var(--neutral-600);
  --week-day-bg: color-mix(in srgb, var(--white) 14%, transparent);  --week-day-fg: color-mix(in srgb, var(--white) 78%, transparent); --week-day-num: var(--white); --week-day-shadow: none;
  --week-today-bg: var(--white); --week-today-fg: var(--indigo-600); --week-num-size: 32px;
  --today-sum-bg: color-mix(in srgb, var(--white) 14%, transparent); --today-sum-border: color-mix(in srgb, var(--white) 20%, transparent);
  --cal-day-fg: var(--ink); --cal-day-muted: var(--neutral-400); --cal-head-fg: var(--muted);
  --cal-selected-bg: var(--indigo-600); --cal-selected-fg: var(--white); --cal-today-ring: var(--indigo-300);
  --cal-dot-size: 5px; --cal-cell-h: 44px;
  --info-label-fg: var(--muted); --info-value-fg: var(--ink); --info-divider: var(--stroke);
  --bar-h: 8px; --bar-track: var(--neutral-100); --bar-fill: var(--cat-400, var(--lavender-500));
  --budget-bg: var(--indigo-50); --budget-fg: var(--neutral-900); --budget-track: var(--indigo-100); --budget-fill: var(--indigo-600);
  --appbar-h: 56px; --appbar-pad-top: 8px; --appbar-pad-bottom: 8px;   /* المسافة الظاهرة فوق وتحت = 16px بالظبط (8 + (56-40)/2) */ --appbar-fg: var(--white); --appbar-fg-2: color-mix(in srgb, var(--white) 80%, transparent); --appbar-radius: 16px;   /* الهيدر إنديجو متدرج، والمحتوى ورقة بيضا طالعة فوقه */
  --sheet-top-radius: 24px; --sheet-overlap: 20px;
  --surface-shadow: none; --appbar-bg: var(--indigo-500); --appbar-border: transparent;
  --switch-w: 46px; --switch-h: 28px; --switch-off: var(--neutral-300); --switch-on: var(--indigo-600); --switch-knob: var(--white);
  --tile-add-border: var(--indigo-200); --tile-add-fg: var(--indigo-600);
  --cook-bg: var(--neutral-50); --timer-track: var(--butter-100); --timer-fill: var(--butter-400);
  --step-num-bg: var(--cat-100, var(--lavender-100)); --step-num-fg: var(--cat-800, var(--lavender-800));
  --tip-bg: var(--butter-50); --tip-border: var(--butter-200);
  --ring-track: var(--indigo-200);   --ring-fill: var(--indigo-600);
  --next-bg: var(--white); --next-shadow: var(--elev-1);

  /* Timeline (خط اليوم) */
  --timeline-line: var(--neutral-300);
  --node-past: var(--neutral-700);
  --node-now: var(--pink-400); --node-now-halo: var(--pink-100);
  --node-future: var(--neutral-300);
  --period-tag-bg: var(--neutral-100); --period-tag-fg: var(--neutral-700); --period-ico: var(--neutral-700);

  /* Nav bar */
  --nav-h: 64px; --nav-radius: var(--r-pill);   /* شريط التنقل كبسولة — استثناء من سلّم الحواف */
  --nav-bg: var(--white);
  --nav-item-fg: var(--neutral-400);
  --nav-item-active-bg: var(--indigo-50); --nav-item-active-fg: var(--indigo-600);
  --nav-shadow: 0 8px 30px color-mix(in srgb, var(--indigo-900) 16%, transparent), 0 1px 3px color-mix(in srgb, var(--indigo-900) 8%, transparent);

  /* Input */
  --input-h: 48px; --input-radius: var(--r-lg);
  --input-bg: var(--white); --input-fg: var(--ink); --input-placeholder: var(--neutral-400);
  --input-border: var(--neutral-200); --input-border-focus: var(--indigo-500); --input-border-error: var(--red-500);
  --label-fg: var(--neutral-700); --error-fg: var(--red-600);

  /* Sheet */
  --sheet-bg: var(--white); --sheet-radius: var(--r-xl); --sheet-handle: var(--neutral-300);
  --backdrop: color-mix(in srgb, var(--neutral-900) 40%, transparent);

  /* Toast */
  --toast-bg: var(--neutral-900); --toast-fg: var(--white);

  /* Illustration */
  --ill-line: var(--neutral-900);
}

/* =========================================================
   Category — كل قسم بيحط الـ Scale بتاعته في --cat-*
   أي component جوه .cat-xxx بياخد ألوان القسم لوحده
   ========================================================= */
.cat-clean   { --cat-50:var(--lime-50);      --cat-100:var(--lime-100);      --cat-200:var(--lime-200);      --cat-300:var(--lime-300);      --cat-400:var(--lime-400);      --cat-600:var(--lime-600);      --cat-700:var(--lime-700);      --cat-800:var(--lime-800);      --cat-900:var(--lime-900) }
.cat-kitchen { --cat-50:var(--butter-50);    --cat-100:var(--butter-100);    --cat-200:var(--butter-200);    --cat-300:var(--butter-300);    --cat-400:var(--butter-400);    --cat-600:var(--butter-600);    --cat-700:var(--butter-700);    --cat-800:var(--butter-800);    --cat-900:var(--butter-900) }
.cat-shop    { --cat-50:var(--periwinkle-50);     --cat-100:var(--periwinkle-100);     --cat-200:var(--periwinkle-200);     --cat-300:var(--periwinkle-300);     --cat-400:var(--periwinkle-400);     --cat-600:var(--periwinkle-600);     --cat-700:var(--periwinkle-700);     --cat-800:var(--periwinkle-800);     --cat-900:var(--periwinkle-900) }
.cat-bills   { --cat-50:var(--peach-50); --cat-100:var(--peach-100); --cat-200:var(--peach-200); --cat-300:var(--peach-300); --cat-400:var(--peach-400); --cat-600:var(--peach-600); --cat-700:var(--peach-700); --cat-800:var(--peach-800); --cat-900:var(--peach-900) }
.cat-organize{ --cat-50:var(--lavender-50);     --cat-100:var(--lavender-100);     --cat-200:var(--lavender-200);     --cat-300:var(--lavender-300);     --cat-400:var(--lavender-400);     --cat-600:var(--lavender-600);     --cat-700:var(--lavender-700);     --cat-800:var(--lavender-800);     --cat-900:var(--lavender-900) }
.cat-events  { --cat-50:var(--pink-50);     --cat-100:var(--pink-100);     --cat-200:var(--pink-200);     --cat-300:var(--pink-300);     --cat-400:var(--pink-400);     --cat-600:var(--pink-600);     --cat-700:var(--pink-700);     --cat-800:var(--pink-800);     --cat-900:var(--pink-900) }
/* الـ component tokens اللي بتعتمد على القسم لازم تتحسب تاني جوه العنصر */
[class*="cat-"]{
  --chip-icon-fg: var(--cat-700);
  --li-meta-fg: var(--cat-700);
  --li-icon-fg: var(--cat-700);
  --tile-bg: var(--cat-100); --tile-border: var(--cat-200); --tile-title-fg: var(--cat-900); --tile-sub-fg: var(--cat-800); --tile-count-fg: var(--cat-800);
  --card-icon-fg: var(--cat-700);
}

/* =========================================================
   Period — كل فترة بلون وقتها
   الصبح = شروق (أصفر)، الضهر = شمس (برتقالي)، بالليل = سما (بنفسجي)
   ========================================================= */
.p-morning{ --p-100:var(--butter-100);  --p-200:var(--butter-200);  --p-300:var(--butter-300);  --p-500:var(--butter-500);  --p-800:var(--butter-800) }
.p-noon   { --p-100:var(--peach-100); --p-200:var(--peach-200); --p-300:var(--peach-300); --p-500:var(--peach-400); --p-800:var(--peach-800) }
.p-night  { --p-100:var(--lavender-100); --p-200:var(--lavender-200); --p-300:var(--lavender-300); --p-500:var(--lavender-500); --p-800:var(--lavender-800) }
.p-morning, .p-noon, .p-night{
  --node-past: var(--p-500); --node-now: var(--p-500); --node-now-halo: var(--p-200); --node-future: var(--p-300);
  --period-tag-bg: var(--p-100); --period-tag-fg: var(--p-800); --period-ico: var(--p-500);
}

/* =========================================================
   Base
   ========================================================= */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none; direction:rtl}
/* الصفحة نفسها ثابتة، والمحتوى بيسكرول جوه #scroller.
   ده بيحل باج iOS 26: بعد ما الكيبورد يقفل، الآيفون بيسيب الصفحة مزحزحة فالناف بار يطلع لفوق. */
#scroller{position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:var(--fs-body); line-height:1.6; -webkit-font-smoothing:antialiased}
body.locked #scroller{overflow:hidden}
button,input,select{font:inherit; color:inherit}
b,strong{font-weight:var(--fw-medium)}
h1,h2,h3{font-weight:var(--fw-semibold)}
button{background:none; border:0; padding:0; cursor:pointer; text-align:inherit}
:focus-visible{outline:2px solid var(--pink-600); outline-offset:2px; border-radius:var(--r-lg)}
.gutter{padding-left:max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right:max(var(--gutter), env(safe-area-inset-right, 0px))}
.wrap{max-width:430px; margin:0 auto}

/* =========================================================
   Button
   ========================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s-2);
  height:var(--btn-h-md); padding:0 var(--btn-px-md); border-radius:var(--btn-radius);
  font-size:var(--fs-body); font-weight:var(--fw-medium); white-space:nowrap;
  transition:transform .12s ease, background .15s ease;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:var(--btn-disabled-opacity); pointer-events:none}
.btn svg{width:18px; height:18px}
.btn-lg{height:var(--btn-h-lg); width:100%; font-size:var(--fs-title); font-weight:var(--fw-medium)}
.btn-sm{height:var(--btn-h-sm); padding:0 var(--btn-px-sm); font-size:var(--fs-meta); border-radius:var(--r-md)}
.btn-primary{background:var(--btn-primary-bg); color:var(--btn-primary-fg)}
.btn-primary:active{background:var(--btn-primary-bg-pressed)}
.btn-secondary{background:var(--btn-secondary-bg); color:var(--btn-secondary-fg); box-shadow:inset 0 0 0 1.5px var(--btn-secondary-border)}
.btn-soft{background:var(--btn-soft-bg); color:var(--btn-soft-fg)}
.btn-text{background:none; color:var(--btn-text-fg); padding:0 4px; height:auto}
.btn-danger{background:none; color:var(--btn-danger-fg)}
/* المسح: زرار ثانوي أحمر، ولما تدوسي عليه بتطلع رسالة تأكيد */
.btn-destructive{background:var(--btn-destructive-bg); color:var(--btn-destructive-fg); box-shadow:inset 0 0 0 1.5px var(--btn-destructive-border)}
.btn-destructive-solid{background:var(--btn-destructive-solid-bg); color:var(--btn-destructive-solid-fg)}
/* رسالة التأكيد */
.dialog-backdrop{position:fixed; inset:0; z-index:60; background:var(--backdrop); animation:fade .15s ease}
.dialog{position:fixed; z-index:61; left:50%; top:50%; transform:translate(-50%,-50%); width:calc(100% - 64px); max-width:320px; padding:20px 16px 16px; border-radius:var(--dialog-radius); background:var(--dialog-bg); box-shadow:var(--dialog-shadow); text-align:center; animation:dlgIn .18s cubic-bezier(.2,.8,.2,1)}
.dialog h2{margin:0 0 6px; font-size:var(--fs-title); font-weight:var(--fw-semibold); color:var(--dialog-title-fg)}
.dialog p{margin:0; font-size:var(--fs-body); color:var(--dialog-msg-fg)}
.dialog-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:20px}
.dialog-actions .btn{height:44px; width:100%; font-weight:var(--fw-medium)}
@keyframes dlgIn{from{opacity:0; transform:translate(-50%,-50%) scale(.94)} to{opacity:1; transform:translate(-50%,-50%) scale(1)}}

/* Icon button */
.icon-btn{flex:none; width:var(--icon-btn-size); height:var(--icon-btn-size); border-radius:50%; display:grid; place-items:center; position:relative}
.icon-btn svg{width:20px; height:20px}
.icon-btn-sm{width:var(--icon-btn-size-sm); height:var(--icon-btn-size-sm)}
.icon-btn-sm svg{width:16px; height:16px}
.icon-btn-on-brand{background:var(--icon-btn-on-brand-bg); color:var(--icon-btn-on-brand-fg)}
.icon-btn-surface{background:var(--icon-btn-surface-bg); color:var(--icon-btn-surface-fg); box-shadow:var(--icon-btn-surface-shadow)}
.icon-btn-accent{background:var(--icon-btn-accent-bg); color:var(--icon-btn-accent-fg)}
.icon-btn-primary{background:var(--icon-btn-primary-bg); color:var(--icon-btn-primary-fg)}
.badge-dot{position:absolute; top:8px; inset-inline-end:9px; width:8px; height:8px; border-radius:50%; background:var(--badge-dot); box-shadow:0 0 0 2px var(--white)}

/* Check */
.check{flex:none; position:relative; width:var(--check-size); height:var(--check-size); border-radius:50%; border:1.5px solid var(--check-border); background:var(--white); display:grid; place-items:center; transition:all .2s ease}
.check::after{content:""; position:absolute; inset:-12px}   /* مساحة اللمس تفضل ٤٤px رغم إن الدايرة صغيرة */
.check svg{width:10px; height:10px; opacity:0; transform:scale(.5); transition:all .2s ease}
.is-done .check{background:var(--check-done-bg); border-color:var(--check-done-bg)}
.is-done .check svg{opacity:1; transform:scale(1)}
.check-lg{width:40px; height:40px; margin-inline-end:2px}
.check-lg svg{width:16px; height:16px}

/* =========================================================
   Chip · Segmented · Tag
   ========================================================= */
.chip{
  flex:none; display:inline-flex; align-items:center; justify-content:center; gap:4px;
  height:var(--chip-h); padding:0 var(--chip-px); border:0; border-radius:var(--chip-radius);
  background:var(--chip-bg); color:var(--chip-fg); box-shadow:inset 0 0 0 1px var(--chip-border);
  font-size:var(--fs-body); font-weight:var(--chip-weight); white-space:nowrap;
  transition:background .15s ease, color .15s ease, box-shadow .15s ease;
}
.chip:active{background:var(--chip-bg-pressed)}
.chip .count{font-size:var(--fs-meta); color:var(--chip-count-fg)}
.chip-check{display:none; margin-inline-start:-2px}
.chip-check svg{width:14px; height:14px}
/* selected */
.chip[aria-pressed="true"], .chip[aria-checked="true"]{background:var(--chip-bg-selected); color:var(--chip-fg-selected); box-shadow:inset 0 0 0 1px var(--chip-border-selected)}
.chip[aria-pressed="true"] .chip-check, .chip[aria-checked="true"] .chip-check{display:inline-flex}
.chip[aria-pressed="true"] .count, .chip[aria-checked="true"] .count{color:var(--chip-count-fg-selected)}
/* disabled: من غير خلفية، وإطار متقطع، عشان يبان إنه مش متاح */
.chip:disabled{background:var(--chip-bg-disabled); color:var(--chip-fg-disabled); box-shadow:none; border:1px dashed var(--chip-border-disabled); cursor:not-allowed}
.chip:disabled .chip-ico{opacity:.5}
.chip:disabled[aria-pressed="true"], .chip:disabled[aria-checked="true"]{background:var(--chip-bg-selected); color:var(--chip-fg-selected); border:0; box-shadow:inset 0 0 0 1px var(--chip-border-selected); opacity:var(--chip-disabled-selected-opacity)}
.chip-ico{flex:none; width:18px; height:18px; margin-inline-start:-2px; border-radius:50%; display:grid; place-items:center; background:var(--chip-icon-bg); color:var(--chip-icon-fg)}
.chip-ico svg{width:16px; height:16px}
.chip-row{display:flex; gap:var(--s-2); overflow-x:auto; scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
/* الـ chips على قد الكلام وبتنزل سطر جديد، مش بتتمط زي الزراير */
.chip-grid{display:flex; flex-wrap:wrap; gap:var(--chip-gap)}
/* استثناء: الأيام والدقايق، كلها نفس العرض */
.chip-grid.is-even{display:grid; gap:6px}
.chip-grid.is-even .chip{padding:0; width:100%}
.chip-grid.is-even .chip-check, .seg .chip-check{display:none !important}

.seg{display:grid; gap:2px; background:var(--seg-bg); padding:3px; border-radius:var(--r-lg)}
.seg .chip{height:34px; padding:0; background:none; box-shadow:none; color:var(--seg-fg); font-size:var(--fs-meta)}
.seg .chip[aria-checked="true"]{background:var(--seg-bg-selected); color:var(--seg-fg-selected); box-shadow:0 1px 3px color-mix(in srgb, var(--lavender-900) 15%, transparent)}

.tag{display:inline-flex; align-items:center; height:var(--tag-h); padding:0 8px; border-radius:var(--r-sm); background:var(--tag-bg); color:var(--tag-fg); font-size:var(--fs-meta); font-weight:var(--fw-medium); white-space:nowrap}
.tag-accent{background:var(--tag-accent-bg); color:var(--tag-accent-fg)}
.tag-brand{background:var(--tag-brand-bg); color:var(--tag-brand-fg)}
.tag-urgent{background:var(--tag-urgent-bg); color:var(--tag-urgent-fg)}
.tag-soon{background:var(--tag-soon-bg); color:var(--tag-soon-fg)}
.tag-later{background:var(--tag-later-bg); color:var(--tag-later-fg)}
.tag-on-brand{background:var(--today-card-bg); color:var(--today-card-fg)}

/* Icon circle */
.ico{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--li-icon-bg); color:var(--li-icon-fg)}
.ico svg{width:24px; height:24px}
.ico-sm{width:22px; height:22px}
.ico-sm svg{width:20px; height:20px}

/* Input */
.input{width:100%; height:var(--input-h); border:1.5px solid var(--input-border); border-radius:var(--input-radius); background:var(--input-bg); color:var(--input-fg); padding:0 14px; font-size:var(--fs-body); outline:none}
.input::placeholder{color:var(--input-placeholder)}
.input:focus{border-color:var(--input-border-focus)}
.input.is-error{border-color:var(--input-border-error)}
select.input{appearance:none; -webkit-appearance:none}
.field-label{display:block; font-size:var(--fs-meta); font-weight:var(--fw-medium); color:var(--label-fg); margin:var(--s-4) 0 var(--s-2)}
.field-error{font-size:var(--fs-meta); color:var(--error-fg); margin-top:6px}

/* =========================================================
   Hero
   ========================================================= */
.hero{background:var(--hero-bg); color:var(--hero-fg); padding-block:0 calc(var(--sheet-overlap) + 16px); margin-top:-1px}
.hero-min{padding:0; height:calc(var(--sheet-overlap) + 4px)}
.hero-tuck{padding-bottom:0}
.hero-tuck .tuck{margin-bottom:0; border-bottom-left-radius:0; border-bottom-right-radius:0; padding-bottom:calc(14px + var(--sheet-overlap))}
.hello{display:flex; align-items:center; gap:10px}
.avatar{flex:none; width:40px; height:40px; border-radius:50%; background:var(--hero-avatar-bg); color:var(--hero-avatar-fg); display:grid; place-items:center; font-weight:var(--fw-medium); font-size:var(--fs-title)}
.hello-text{flex:1; min-width:0; line-height:1.4}
.hello-title{font-size:var(--fs-title); font-weight:var(--fw-semibold); display:block}
.hello-sub{font-size:var(--fs-meta); color:var(--hero-fg-2)}

/* شريط الأسبوع: من غير كروت، اسم اليوم صغير والرقم في دايرة */
.week{display:grid; grid-template-columns:repeat(7, 1fr); margin:0}
.wday{position:relative; width:100%; font:inherit; display:flex; flex-direction:column; align-items:center; gap:4px; padding:2px 0 8px; background:none; color:var(--week-day-fg); font-size:var(--fs-meta)}
.wday b{width:var(--week-num-size); height:var(--week-num-size); border-radius:50%; display:grid; place-items:center; font-size:var(--fs-title); font-weight:var(--fw-medium); color:var(--week-day-num); transition:background .15s ease}
.wday.past{opacity:.55}
.wday.today b{background:var(--week-today-bg); color:var(--week-today-fg)}                            /* النهارده: دايرة بيضا */
.wday[aria-pressed="true"]:not(.today) b{box-shadow:inset 0 0 0 1.5px var(--white); opacity:1}         /* يوم مختار: دايرة بإطار */
.wday[aria-pressed="true"]{opacity:1}
.wday.today:not([aria-pressed="true"]) b{background:color-mix(in srgb, var(--white) 22%, transparent); color:var(--white)}   /* النهارده لما يكون في يوم تاني مختار */
.wdot{position:absolute; bottom:1px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:currentColor; opacity:.8}
.week-bar{display:flex; align-items:center; justify-content:space-between; margin:0 0 4px}
.wk-nav{display:flex; gap:4px}
.wk-btn{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:var(--white); background:none}
.wk-btn:active{background:color-mix(in srgb, var(--white) 14%, transparent)}
.wk-btn svg{width:18px; height:18px}
.wk-month{display:inline-flex; align-items:center; gap:4px; color:var(--white); font-weight:var(--fw-medium); font-size:var(--fs-body); padding:4px 0; border-radius:var(--r-pill)}
.wk-month svg{width:16px; height:16px}
.day-card{justify-content:space-between}

.today-card{display:flex; align-items:center; gap:12px; background:var(--today-card-bg); color:var(--today-card-fg); border-radius:var(--r-lg); padding:14px}
.today-ill{flex:none; width:118px; height:96px}
.today-info{flex:1; min-width:0}
.today-title{font-size:var(--fs-title); font-weight:var(--fw-medium); display:block}
.today-sub{font-size:var(--fs-meta); color:var(--today-card-fg-2)}
.ring{flex:none; width:58px; height:58px; position:relative; display:grid; place-items:center}
.ring svg{position:absolute; inset:0; transform:rotate(-90deg)}
.ring b{font-size:var(--fs-title); font-weight:var(--fw-medium)}
/* ملخص اليوم جوه الخلفية البنفسجي: من غير كارت أبيض */
.today-sum{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; padding:12px; border-radius:var(--r-lg); background:var(--today-sum-bg); box-shadow:inset 0 0 0 1px var(--today-sum-border); color:var(--hero-fg)}
.today-sum .today-title{font-size:var(--fs-title)}
.today-sum .today-sub{color:var(--hero-fg-2)}
.today-sum .ring{width:48px; height:48px; --ring-track:color-mix(in srgb, var(--white) 25%, transparent); --ring-fill:var(--white)}
.today-sum .ring b{font-size:var(--fs-meta)}
.today-sum .btn{flex:none; background:var(--white); color:var(--indigo-600)}

.next{margin-top:10px; display:flex; align-items:center; gap:10px; background:var(--next-bg); box-shadow:var(--next-shadow); color:var(--ink); border-radius:var(--r-lg); padding:6px}
.next-text{flex:1; min-width:0; line-height:1.35}
.next-label{font-size:var(--fs-meta); color:var(--li-meta-fg); display:block}
.next-title{font-size:var(--fs-body); font-weight:var(--fw-medium); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.page-hero{display:flex; align-items:center; gap:12px; margin-top:0}
.page-ill{width:84px; height:84px; flex:none; border-radius:var(--r-lg); padding:4px; background:var(--tile-bg, var(--white))}
.page-text{flex:1; min-width:0}
.page-hero h1{font-size:var(--fs-title); font-weight:var(--fw-semibold); margin:0}
.page-name{display:block; font-size:var(--fs-title); font-weight:var(--fw-medium); line-height:1.6}
.screen-top{padding-top:22px}
.page-hero p{margin:2px 0 0; font-size:var(--fs-meta); color:var(--hero-fg-2)}

/* =========================================================
   المحتوى
   ========================================================= */
.screen{position:relative; z-index:1; background:var(--bg); border-radius:var(--sheet-top-radius) var(--sheet-top-radius) 0 0; margin-top:calc(-1 * var(--sheet-overlap)); min-height:60vh; padding-block:22px calc(var(--nav-h) + var(--safe-bottom) + 40px)}
.block + .block{margin-top:26px}
.section-head{display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; min-height:24px}
.section-title{font-size:var(--fs-title); font-weight:var(--fw-semibold); margin:0}

/* Tile */
.tiles{display:grid; grid-template-columns:repeat(var(--tile-cols), 1fr); gap:10px}
.cal{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--surface-shadow); padding:12px}
.cal-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.cal-top b{font-size:var(--fs-title); font-weight:var(--fw-medium)}
.cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; text-align:center}
.cal-h{font-size:var(--fs-meta); color:var(--cal-head-fg); padding:4px 0}
.cal-d{height:var(--cal-cell-h); border-radius:var(--r-md); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--cal-day-fg); font-weight:var(--fw-medium); font-size:var(--fs-body)}
.cal-d.is-past{color:var(--cal-day-muted)}
.cal-d.is-today{box-shadow:inset 0 0 0 1.5px var(--cal-today-ring)}
.cal-d[aria-pressed="true"]{background:var(--cal-selected-bg); color:var(--cal-selected-fg); box-shadow:none}
.dots{display:flex; gap:2px; height:var(--cal-dot-size)}
.dot{display:block; width:var(--cal-dot-size); height:var(--cal-dot-size); border-radius:50%; background:var(--cat-600)}
.cal-toggle{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-top:8px; padding-top:10px; border-top:1px solid var(--stroke); font-size:var(--fs-meta); font-weight:var(--fw-medium); color:var(--brand)}
.cal-toggle svg{width:16px; height:16px; transform:rotate(-90deg); transition:transform .2s}
.cal-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.cal-top .cal-mid{display:flex; flex-direction:column; align-items:center; gap:4px}
.li-tap{display:flex; align-items:center; gap:12px; flex:1; min-width:0; text-align:start}
.fold{display:flex; align-items:center; gap:12px; width:100%; padding:12px; min-height:var(--li-min-h); border-radius:var(--li-radius); background:var(--li-bg); box-shadow:inset 0 0 0 1px var(--li-border), var(--li-shadow); color:var(--ink); font-weight:var(--fw-medium); font-size:var(--fs-body)}
.fold .chev{margin-inline-start:auto; transform:rotate(-90deg); transition:transform .2s}
.fold[aria-expanded="true"] .chev{transform:rotate(90deg)}
.detail-head{display:flex; align-items:center; gap:12px}
.detail-head h2{flex:1; font-size:var(--fs-title); font-weight:var(--fw-medium); margin:0}
.detail-tags{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 6px}
.info{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--info-divider); font-size:var(--fs-body)}
.info:last-of-type{border-bottom:0}
.info dt{flex:none; width:84px; color:var(--info-label-fg)}
.info dd{margin:0; color:var(--info-value-fg); font-weight:var(--fw-medium)}
.day-head{display:flex; align-items:baseline; gap:8px; margin-bottom:8px}
.day-head b{font-size:var(--fs-body); font-weight:var(--fw-medium)}
.day-head span{font-size:var(--fs-meta); color:var(--muted)}
.day-note{font-size:var(--fs-meta); color:var(--muted); margin-top:6px}
.tiles-2{--tile-cols: 2; --tile-min-h: 120px; --tile-ill-size: 52px}
.tile{position:relative; display:flex; flex-direction:column; justify-content:flex-end; min-height:var(--tile-min-h); border-radius:var(--tile-radius); padding:10px 12px; overflow:hidden; background:var(--tile-bg); border:1.5px solid var(--tile-border); transition:transform .15s ease, border-color .15s ease}
.tile[aria-pressed="true"]{border:2px solid var(--tile-border-selected); transform:scale(.97)}
.tile-name{font-size:var(--fs-title); font-weight:var(--fw-medium); display:block; line-height:1.4; color:var(--tile-title-fg)}
.tile-sub{font-size:var(--fs-meta); line-height:1.4; display:block; color:var(--tile-sub-fg)}
.tile-count{position:absolute; top:10px; inset-inline-start:10px; min-width:var(--tile-count-size); height:var(--tile-count-size); padding:0 6px; border-radius:var(--r-md); background:var(--tile-count-bg); color:var(--tile-count-fg); display:grid; place-items:center; font-size:var(--fs-meta); font-weight:var(--fw-medium)}
.tile-ill{position:absolute; top:4px; inset-inline-end:4px; width:var(--tile-ill-size); height:var(--tile-ill-size)}

/* Timeline */
.day{position:relative; padding-inline-start:28px}
.day::before{content:""; position:absolute; inset-inline-start:8px; top:10px; bottom:10px; width:2px; border-radius:2px; background:repeating-linear-gradient(to bottom, var(--timeline-line) 0 6px, transparent 6px 11px)}
.period{position:relative}
.period + .period{margin-top:20px}
.node{position:absolute; inset-inline-start:-28px; top:4px; width:18px; height:18px; border-radius:50%; background:var(--bg); border:2px solid var(--node-future)}
.period.is-now .node{background:var(--node-now); border-color:var(--node-now); box-shadow:0 0 0 5px var(--node-now-halo)}
.period.is-past .node{background:var(--node-past); border-color:var(--node-past); opacity:.55}
.period-ico{display:grid; place-items:center; color:var(--period-ico)}
.period-ico svg{width:18px; height:18px}
.period-head .tag{background:var(--period-tag-bg); color:var(--period-tag-fg)}
.period.is-now .period-head .tag{background:var(--p-200, var(--period-tag-bg))}
.period-head{display:flex; align-items:center; gap:6px; margin-bottom:8px}
.period-name{font-weight:var(--fw-medium); font-size:var(--fs-title)}
.list{display:flex; flex-direction:column; gap:8px}

/* List item */
.li{display:flex; align-items:center; gap:12px; width:100%; min-height:var(--li-min-h); padding:10px 12px; border-radius:var(--li-radius); background:var(--li-bg); box-shadow:inset 0 0 0 1px var(--li-border), var(--li-shadow); transition:background .2s ease}
.li-body{flex:1; min-width:0}
.li-title{font-size:var(--fs-body); font-weight:var(--fw-medium); display:block; color:var(--li-title-fg)}
.li-meta{font-size:var(--fs-meta); color:var(--li-meta-fg)}
.li.is-done{background:var(--li-done-bg); box-shadow:inset 0 0 0 1px var(--neutral-200)}
.li.is-done > :not(.check){opacity:var(--li-done-opacity)}
.li.is-done .li-title{color:var(--li-done-fg); text-decoration:line-through; font-weight:500}
.li.is-done .li-meta{color:var(--li-done-fg)}
.li.is-done .ico{filter:grayscale(1)}
.chev{flex:none; color:var(--li-meta-fg); opacity:.6}
.chev svg{width:18px; height:18px}
.empty{background:var(--surface); box-shadow:var(--surface-shadow); border-radius:var(--li-radius); padding:22px; text-align:center; color:var(--muted)}

/* Card */
.cards{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{flex:none; width:156px; border-radius:var(--card-radius); padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--card-bg); box-shadow:inset 0 0 0 1px var(--card-border), var(--card-shadow)}
.card-top{display:flex; justify-content:space-between; align-items:center}
.card .ico{background:var(--card-icon-bg); color:var(--card-icon-fg)}
.card-title{font-size:var(--fs-body); font-weight:var(--fw-medium); line-height:1.45; color:var(--card-title-fg)}

/* تاب المهام */
.group + .group{margin-top:22px}
.group-head{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.group-name{font-size:var(--fs-title); font-weight:var(--fw-medium); color:var(--cat-800, var(--ink))}
.group-head .tag{background:var(--cat-100); color:var(--cat-700)}

/* =========================================================
   Sheet · Toast
   ========================================================= */
.backdrop{position:fixed; inset:0; z-index:25; background:var(--backdrop); animation:fade .2s ease}
.sheet{
  position:fixed; bottom:0; left:0; right:0; z-index:30; margin:0 auto; max-width:430px; max-height:88%;
  overflow-y:auto; overscroll-behavior:contain; background:var(--sheet-bg);
  border-radius:var(--sheet-radius) var(--sheet-radius) 0 0; animation:up .28s cubic-bezier(.2,.8,.2,1);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(var(--safe-bottom) + 20px) max(16px, env(safe-area-inset-left, 0px));
}
.handle{width:40px; height:5px; border-radius:var(--r-pill); background:var(--sheet-handle); margin:0 auto 10px}
.sheet-head{display:flex; justify-content:space-between; align-items:center}
.sheet-head h2{font-size:var(--fs-title); font-weight:var(--fw-semibold); margin:0}
.sheet-actions{display:flex; flex-direction:column; gap:var(--s-2); margin-top:22px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

.toast{position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--safe-bottom) + 26px); transform:translateX(-50%); z-index:40; background:var(--toast-bg); color:var(--toast-fg); padding:8px 18px; border-radius:var(--r-md); font-size:var(--fs-meta); font-weight:var(--fw-medium); opacity:0; transition:opacity .2s ease; pointer-events:none; white-space:nowrap}
.toast.show{opacity:1}

/* =========================================================
   Nav bar
   ========================================================= */
.nav{position:fixed; inset-inline:0; bottom:0; z-index:10; padding-bottom:calc(var(--safe-bottom) + 10px); pointer-events:none}
.nav-in{pointer-events:auto; height:var(--nav-h); background:var(--nav-bg); border-radius:var(--nav-radius); display:flex; align-items:center; justify-content:space-between; padding:0 8px; box-shadow:var(--nav-shadow)}
.nav-item{height:48px; min-width:48px; border-radius:var(--r-pill); display:flex; align-items:center; justify-content:center; gap:6px; color:var(--nav-item-fg); padding:0 12px; transition:background .2s ease}
.nav-item svg{width:22px; height:22px}
.nav-item span{display:none; font-size:var(--fs-meta); font-weight:var(--fw-medium)}
.nav-item[aria-current="page"]{background:var(--nav-item-active-bg); color:var(--nav-item-active-fg)}
.nav-item[aria-current="page"] span{display:inline}
/* لما الكيبورد يفتح نخفي الناف بار زي الأبلكيشنز الحقيقية، عشان الآيفون ميطلعهوش فوق الكيبورد */
body.kb-open .nav{opacity:0; visibility:hidden; transition:none}

.tag-done{background:var(--tag-done-bg); color:var(--tag-done-fg)}
.tag svg{width:12px; height:12px; margin-inline-end:3px}
.tag-btn{border:0; cursor:pointer; height:28px; padding:0 10px}
textarea.input{height:auto; min-height:96px; padding:10px 14px; line-height:1.7; resize:vertical}
.hint{font-size:var(--fs-meta); color:var(--muted); margin:10px 0 12px}
.amount{font-size:var(--fs-body); font-weight:var(--fw-medium); white-space:nowrap}
.check.is-on{background:var(--check-done-bg); border-color:var(--check-done-bg)}
.check.is-on svg{opacity:1; transform:scale(1)}
.li[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--check-done-bg), var(--li-shadow)}
.tile-add{background:transparent; border:1.5px dashed var(--tile-add-border); color:var(--tile-add-fg); align-items:center; justify-content:center; gap:6px; font-weight:var(--fw-medium)}
.tile-add svg{width:22px; height:22px}
/* Bar */
.bar{display:block; height:var(--bar-h); border-radius:var(--r-pill); background:var(--bar-track); overflow:hidden}
.bar i{display:block; height:100%; border-radius:inherit; background:var(--bar-fill); transition:width .4s ease}
/* أكل الأسبوع */
.meal-row{gap:10px}
.meal-card{background:var(--surface); border-radius:var(--r-lg); box-shadow:inset 0 0 0 1px var(--stroke), var(--surface-shadow); padding:14px}
.meal-top{display:flex; align-items:center; gap:12px; width:100%; text-align:start}
.meal-ill{flex:none; width:64px; height:64px; border-radius:var(--r-lg); background:var(--cat-100); padding:4px}
.meal-info{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.5}
.meal-kicker{font-size:var(--fs-meta); font-weight:var(--fw-medium); color:var(--cat-700)}
.meal-info b{font-size:var(--fs-title); font-weight:var(--fw-medium)}
.meal-sub{font-size:var(--fs-meta); color:var(--muted)}
.meal-progress{display:flex; flex-direction:column; gap:6px; margin:14px 0 12px; font-size:var(--fs-meta); font-weight:var(--fw-medium); color:var(--muted)}
.meal-progress .bar i{background:var(--cat-400)}
.ing-chips{display:flex; flex-wrap:wrap; gap:8px}
.ing-chip{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:var(--r-pill); font-size:var(--fs-body); font-weight:var(--fw-medium); transition:background .15s ease}
.ing-chip svg{width:15px; height:15px; flex:none}
.ing-chip.is-missing{background:var(--white); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--neutral-300); border:0; outline:1.5px dashed transparent}
.ing-chip.is-missing{box-shadow:none; border:1.5px dashed var(--neutral-400)}
.ing-chip.is-need{background:var(--cat-200); color:var(--cat-900)}
.ing-chip.is-bought, .ing-chip.is-have{background:var(--neutral-100); color:var(--muted)}
.ing-chip.is-bought span, .ing-chip.is-have span{text-decoration:line-through; text-decoration-color:var(--neutral-400)}
.ing-chip:disabled{cursor:default}
.ing-legend{display:flex; gap:14px; margin-top:12px; font-size:var(--fs-meta); color:var(--muted)}
.ing-legend span{display:inline-flex; align-items:center; gap:5px}
.lg{width:12px; height:12px; border-radius:50%}
.lg-missing{border:1.5px dashed var(--neutral-400)}
.lg-need{background:var(--cat-200)}
.lg-ok{background:var(--neutral-200)}
.meal-empty{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:20px}
.meal-empty-text{color:var(--muted)}
.meal-head{display:flex; align-items:center; gap:12px; width:100%; margin-bottom:8px; padding:10px 12px; border-radius:var(--li-radius); background:var(--cat-50); box-shadow:inset 0 0 0 1px var(--cat-200)}
.meal-head .btn{flex:none}
.meal-day{flex:none; width:56px; display:flex; flex-direction:column; line-height:1.3; font-size:var(--fs-meta); color:var(--muted)}
.meal-day b{font-size:var(--fs-body); color:var(--ink)}
/* الوصفة */
.ing{background:var(--surface); border-radius:var(--r-lg); box-shadow:inset 0 0 0 1px var(--stroke), var(--surface-shadow); padding:4px 14px}
.ing-row{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--stroke); font-size:var(--fs-body)}
.ing-row:last-child{border-bottom:0}
.ing-row b{font-weight:var(--fw-medium); color:var(--cat-800); text-align:end}
.steps{list-style:none; margin:0; padding:0; counter-reset:st; display:flex; flex-direction:column; gap:8px}
.steps li{counter-increment:st; display:flex; align-items:flex-start; gap:10px; background:var(--surface); border-radius:var(--r-lg); padding:12px; box-shadow:inset 0 0 0 1px var(--stroke), var(--surface-shadow); line-height:1.8}
.steps li::before{content:counter(st, arabic-indic); flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--step-num-bg); color:var(--step-num-fg); font-weight:var(--fw-medium); font-size:var(--fs-meta)}
.steps li > span:first-child{flex:1}
.tip{margin-top:18px; background:var(--tip-bg); border:1px solid var(--tip-border); border-radius:var(--r-lg); padding:12px 14px; line-height:1.8}
.tip b{display:block; font-size:var(--fs-meta); color:var(--butter-800)}
/* وضع الطبخ */
#cook{position:fixed; inset:0; z-index:50; background:var(--cook-bg)}
.cook-in{height:100%; display:flex; flex-direction:column; gap:14px; max-width:430px; margin:0 auto; padding:calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 16px)}
.cook-top{display:flex; align-items:center; gap:10px}
.cook-title{flex:1; font-weight:var(--fw-medium); font-size:var(--fs-title); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cook-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center}
.cook-n{font-size:var(--fs-meta); font-weight:var(--fw-medium); color:var(--cat-700)}
.cook-text{margin:0; font-size:var(--fs-title); font-weight:var(--fw-medium); line-height:2; max-width:320px}
.timer{position:relative; width:168px; height:168px; display:grid; place-items:center}
.timer svg{position:absolute; inset:0; transform:rotate(-90deg)}
.timer b{font-size:var(--fs-title); font-weight:var(--fw-medium); letter-spacing:1px}
.cook-nav{display:grid; grid-template-columns:1fr 1.4fr; gap:10px}
.cook-nav .btn{height:var(--btn-h-lg)}
/* المشتريات */
.add-row{display:flex; gap:8px; margin-bottom:6px}
.add-row .input{min-width:0}
/* لما خانة تاخد focus وتتسكرول، متستخباش تحت الهيدر */
#scroller .input{scroll-margin-top:calc(var(--safe-top) + var(--appbar-h) + 24px)}
.add-row .add-name{flex:1}
.add-row .add-qty{flex:0 0 96px}
.done-list{margin-top:16px}
.add-row .icon-btn{width:var(--input-h); height:var(--input-h); border-radius:var(--r-lg)}
.sub-head{display:flex; align-items:center; gap:6px; margin:16px 0 8px; font-size:var(--fs-meta); font-weight:var(--fw-medium); color:var(--muted)}
.sub-head span{background:var(--neutral-100); border-radius:var(--r-sm); padding:0 6px}
.sub-head .btn{margin-inline-start:auto}
/* الفلوس */
.budget{display:flex; flex-direction:column; gap:8px; width:100%; margin-top:14px; padding:16px; border-radius:var(--r-lg); background:var(--budget-bg); color:var(--budget-fg); text-align:start}
.budget-top{display:flex; justify-content:space-between; font-size:var(--fs-meta)}
.budget-edit svg{width:16px; height:16px}
.budget-num{font-size:var(--fs-title); font-weight:var(--fw-medium)}
.bar-on-brand{background:var(--budget-track)}
.bar-on-brand i{background:var(--budget-fill)}
.budget-foot{display:flex; justify-content:space-between; font-size:var(--fs-meta)}
.budget-note{font-size:var(--fs-meta); background:color-mix(in srgb, var(--white) 55%, transparent); border-radius:var(--r-md); padding:4px 8px; align-self:flex-start}
.cats-bars{display:flex; flex-direction:column; gap:12px; background:var(--surface); border-radius:var(--r-lg); padding:14px; box-shadow:inset 0 0 0 1px var(--stroke), var(--surface-shadow)}
.cbar{display:grid; grid-template-columns:72px 1fr auto; align-items:center; gap:10px; font-size:var(--fs-meta)}
.cbar b{font-weight:var(--fw-medium); font-size:var(--fs-meta)}
.cbar .bar i{background:var(--cat-400)}
a.icon-btn{text-decoration:none}
/* المخزن */
.sdot{width:7px; height:7px; border-radius:50%; background:currentColor; margin-inline-end:5px; flex:none}
.stock-tag{height:26px; padding:0 10px; border-radius:var(--r-pill)}
.stock-sum{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.stock-sum .tag{height:28px; padding:0 10px; border-radius:var(--r-pill)}
.stock-opt{display:flex; align-items:center; gap:12px; width:100%; min-height:58px; padding:10px 14px; border-radius:var(--li-radius); background:var(--surface); text-align:start; color:var(--ink)}
.stock-opt .sdot{width:12px; height:12px; margin:0}
.stock-opt.tag-done .sdot{background:var(--tag-done-fg)} .stock-opt.tag-soon .sdot{background:var(--tag-soon-fg)} .stock-opt.tag-urgent .sdot{background:var(--tag-urgent-fg)}
.stock-opt[aria-checked="true"]{box-shadow:inset 0 0 0 1.5px var(--indigo-600)}
.stock-opt.tag-done[aria-checked="true"]{background:var(--tag-done-bg)} .stock-opt.tag-soon[aria-checked="true"]{background:var(--tag-soon-bg)} .stock-opt.tag-urgent[aria-checked="true"]{background:var(--tag-urgent-bg)}
/* قوايم المشتريات */
.list-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.list-card{display:flex; flex-direction:column; gap:6px; min-height:132px; padding:12px; border-radius:var(--r-lg); background:var(--cat-100); box-shadow:inset 0 0 0 1.5px var(--cat-200); text-align:start; color:var(--cat-900)}
.list-card b{font-size:var(--fs-title); font-weight:var(--fw-medium); line-height:1.4; flex:1}
.list-card-top{display:flex; align-items:center; justify-content:space-between}
.list-card-top .tag{background:var(--white); color:var(--cat-800)}
.list-card .ico{color:var(--cat-700)}
.list-card-meta{font-size:var(--fs-meta); color:var(--cat-800)}
.list-card .bar{background:color-mix(in srgb, var(--white) 70%, transparent)}
.list-card .bar i{background:var(--cat-600)}
.list-add{background:transparent; box-shadow:none; border:1.5px dashed var(--indigo-200); color:var(--indigo-600); align-items:center; justify-content:center; text-align:center}
.list-add b{flex:none}
.list-add svg{width:22px; height:22px}
.list-add .list-card-meta{color:var(--muted)}
.list-summary{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; font-size:var(--fs-meta); font-weight:var(--fw-medium); color:var(--muted)}
.wrap > .bar{display:block}
.wrap > .bar i{background:var(--cat-400, var(--indigo-500))}
.del-btn{flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--red-500); color:var(--white)}
.del-btn svg{width:14px; height:14px; stroke-width:3}
.bar-done{height:36px; padding:0 14px; border-radius:var(--r-pill); background:var(--white); color:var(--indigo-600); font-weight:var(--fw-medium); font-size:var(--fs-body)}
/* App bar — الهيدر الثابت فوق كل الصفحات (زي Navigation bar في iOS) */
.appbar{position:sticky; top:0; z-index:20; padding-top:calc(var(--safe-top) + var(--appbar-pad-top)); padding-bottom:var(--appbar-pad-bottom); background:var(--appbar-bg); color:var(--appbar-fg); border-radius:0; box-shadow:0 6px 20px color-mix(in srgb, var(--neutral-900) 0%, transparent); transition:box-shadow .2s ease}
.appbar.is-scrolled{border-radius:0 0 var(--appbar-radius) var(--appbar-radius); box-shadow:0 6px 20px color-mix(in srgb, var(--indigo-900) 22%, transparent)}
.appbar .hello-sub{color:var(--appbar-fg-2)}
.appbar .badge-dot{box-shadow:0 0 0 2px var(--appbar-bg)}
.appbar-in{height:var(--appbar-h); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; max-width:430px; margin:0 auto}
.appbar-start{display:flex; align-items:center; justify-content:flex-start; min-width:0}
.appbar-end{display:flex; align-items:center; justify-content:flex-end; gap:6px}
.appbar-title{font-size:var(--fs-title); font-weight:var(--fw-semibold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; text-align:center}
.back-btn{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; margin-inline-start:-8px; color:var(--appbar-fg); font-size:var(--fs-body); font-weight:var(--fw-medium); max-width:100%}
.back-btn svg{width:24px; height:24px; flex:none}
.back-btn span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar-btn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--appbar-fg); background:color-mix(in srgb, var(--white) 16%, transparent)}
.bar-btn svg{width:22px; height:22px}
.bar-btn:active, .back-btn:active{opacity:.5}
.appbar .avatar{width:36px; height:36px; font-size:var(--fs-body)}
.appbar-home{display:flex; gap:10px}
.appbar-home .hello-title{margin:0}
.appbar-home .bar-btn{margin-inline-start:auto}
/* حركة التنقل: الصفحة الجديدة بتدخل من الشمال (RTL)، والرجوع من اليمين */
@keyframes push{from{opacity:0; transform:translateX(-28px)}}
@keyframes pop{from{opacity:0; transform:translateX(28px)}}
@keyframes fadeIn{from{opacity:0}}
#app.nav-push{animation:push .26s cubic-bezier(.2,.8,.2,1)}
#app.nav-pop{animation:pop .26s cubic-bezier(.2,.8,.2,1)}
#app.nav-fade{animation:fadeIn .18s ease}
/* لمسة الدوسة */
button.li:active, .li-tap:active, .tile:active, .learn-card:active, .meal-top:active{transform:scale(.985); transition:transform .08s ease}
/* Bottom sheet: الهيدر ثابت فوق والشيت بيتسحب لتحت */
.sheet-head{position:sticky; top:-10px; z-index:2; background:var(--sheet-bg); padding:6px 0 10px; margin-top:-6px}
.handle{touch-action:none; cursor:grab; padding:6px 0; background-clip:content-box; height:17px}
.sheet.is-dragging{transition:none}
.sheet.no-anim, .backdrop.no-anim{animation:none}
.sheet{transition:transform .22s ease}
a.btn{text-decoration:none}
/* اتعلمي */
.learn-cards .learn-card{flex:none; width:170px; min-height:132px; display:flex; flex-direction:column; gap:8px; padding:14px; border-radius:var(--r-lg); background:var(--cat-100, var(--butter-100)); box-shadow:inset 0 0 0 1px var(--cat-200, var(--butter-200)); text-align:start}
.learn-q{color:var(--cat-800)}
.learn-q svg{width:22px; height:22px}
.learn-title{font-size:var(--fs-body); font-weight:var(--fw-medium); line-height:1.6; color:var(--cat-900); flex:1}
.learn-meta{font-size:var(--fs-meta); color:var(--cat-700)}
.credit{display:block; margin-top:10px; font-size:var(--fs-meta); color:var(--muted); line-height:1.7; text-decoration:underline; text-decoration-color:var(--neutral-300); text-underline-offset:3px}
.why-list{margin:14px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px}
.why-list li{position:relative; background:var(--surface); border-radius:var(--r-lg); padding:12px 14px; line-height:1.9; box-shadow:inset 0 0 0 1px var(--stroke)}
.tip-why{background:var(--surface); border-color:var(--cat-200)}
.tip-why b{display:flex; align-items:center; gap:4px; color:var(--cat-800)}
.tip-why b svg{width:14px; height:14px}
/* Switch */
.switch{flex:none; position:relative; width:var(--switch-w); height:var(--switch-h); border-radius:var(--r-pill); background:var(--switch-off); transition:background .2s ease}
.switch i{position:absolute; top:3px; inset-inline-start:3px; width:calc(var(--switch-h) - 6px); height:calc(var(--switch-h) - 6px); border-radius:50%; background:var(--switch-knob); box-shadow:0 1px 3px rgba(0,0,0,.2); transition:inset-inline-start .2s ease}
.switch[aria-checked="true"]{background:var(--switch-on)}
.switch[aria-checked="true"] i{inset-inline-start:calc(var(--switch-w) - var(--switch-h) + 3px)}
/* حسابي */
.profile{display:flex; align-items:center; gap:12px; margin-top:0}
.avatar-lg{width:56px; height:56px}
.profile-text{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.5}
.profile-text b{font-size:var(--fs-title); font-weight:var(--fw-medium)}
.profile-text span{font-size:var(--fs-meta); color:var(--hero-fg-2)}
.hero .detail-tags .tag{background:color-mix(in srgb, var(--white) 18%, transparent); color:var(--white)}

/* ---------- الوقت والتكرار ---------- */
const PERIODS = [
  { id: 'morning', name: 'الصبح',  hint: 'قبل ١٢ الضهر', from: 0,  to: 12 },
  { id: 'noon',    name: 'الضهر',  hint: 'من ١٢ لـ ٦',    from: 12, to: 18 },
  { id: 'night',   name: 'بالليل', hint: 'بعد ٦',          from: 18, to: 24 }
];
const periodIndex = id => PERIODS.findIndex(p => p.id === id);
const periodName = id => PERIODS.find(p => p.id === id).name;

const WEEK = [6, 0, 1, 2, 3, 4, 5];
const DAY_NAME  = { 6: 'السبت', 0: 'الحد', 1: 'الاتنين', 2: 'التلات', 3: 'الأربع', 4: 'الخميس', 5: 'الجمعة' };
const DAY_SHORT = { 6: 'سبت', 0: 'حد', 1: 'اتنين', 2: 'تلات', 3: 'أربع', 4: 'خميس', 5: 'جمعة' };
const REPEATS = [['daily', 'كل يوم'], ['weekly', 'كل أسبوع'], ['monthly', 'كل شهر'], ['once', 'مرة واحدة']];
const MINS = [5, 10, 15, 30, 45, 60];

function occursOn(t, d) {
  const r = t.repeat;
  if (r.type === 'daily') return true;
  if (r.type === 'weekly') return r.days.includes(d.getDay());
  if (r.type === 'monthly') {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(r.day, last);
  }
  if (r.type === 'once') return r.date === iso(d);
  return false;
}
function whenLabel(s) {
  const n = daysUntil(s);
  if (n === 0) return 'النهارده';
  if (n === 1) return 'بكرة';
  if (n === 2) return 'بعد بكرة';
  return 'بعد ' + num(n) + ' أيام';
}
/** لون التاج حسب قرب الميعاد */
function urgency(s) {
  const n = daysUntil(s);
  return n <= 1 ? 'tag-urgent' : n <= 4 ? 'tag-soon' : 'tag-later';
}
function repeatLabel(r) {
  if (r.type === 'daily') return 'كل يوم';
  if (r.type === 'weekly') return r.days.length === 7 ? 'كل يوم' : 'كل ' + WEEK.filter(d => r.days.includes(d)).map(d => DAY_NAME[d]).join(' و');
  if (r.type === 'monthly') return 'يوم ' + num(r.day) + ' في الشهر';
  if (r.type === 'once') {
    const n = daysUntil(r.date);
    if (n < 0) return 'خلص ميعادها';
    return n <= 2 ? whenLabel(r.date) : new Date(r.date + 'T00:00').toLocaleDateString('ar-EG', { day: 'numeric', month: 'long' });
  }
  return '';
}

/* ---------- المهام المبدئية ---------- */
function seed() {

  const W = (...days) => ({ type: 'weekly', days });
  const M = day => ({ type: 'monthly', day });

      T('ترتيب السرير وفتح الشبابيك', 'clean',   'morning', 5,  D()),

      T('كنس ومسح الشقة كلها',         'clean',   'morning', 45, W(5)),
      T('تغيير الملايات والفوط',        'clean',   'morning', 15, W(5)),
      T('تنضيف الحمام',                'clean',   'noon',    30, W(3)),
      T('شرا طلبات الأسبوع',           'shop',    'noon',    45, W(5), { note: 'من قايمة الأسبوع' }),

      T('ترتيب التلاجة ورمي اللي باظ',  'organize','night',   10, W(4)),
      T('شرا التموين الشهري',           'shop',    'morning', 60, M(1)),
      T('تنضيف التلاجة من جوه',         'clean',   'morning', 30, M(1)),
      T('تجديد باقة النت',              'bills',   'noon',    5,  M(3)),
      T('دفع فاتورة الكهربا',           'bills',   'noon',    5,  M(5)),
      T('دفع فاتورة الغاز',             'bills',   'noon',    5,  M(10)),
      T('ترتيب الدولاب',                'organize','morning', 30, M(15)),
      T('تنضيف الفرن والشفاط',          'clean',   'noon',    40, M(20)),
      T('الاتصال بصيانة الغسالة',       'organize','noon',    10, O(0)),
      T('تحضير منيو عزومة أهل جوزي',    'events',  'night',   20, O(3)),
      T('عزومة أهل جوزي',               'events',  'night',   180, O(5), { note: '٦ أفراد' })
    ],
    done: {}
  };
}
function load() { try { const raw = localStorage.getItem(KEY); if (raw) return upgrade(JSON.parse(raw)); } catch (e) {} return upgrade({ ...seed(), ...seedExtra() }); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const todayTasks = () => allTasks().filter(t => occursOn(t, new Date()));
const doneList = () => S.done[todayStr()] || [];
const isDone = id => id.startsWith('b:') ? billPaid(S.money.bills.find(b => b.id === id.slice(2)) || {}) : doneList().includes(id);
const nowPeriod = () => { const h = new Date().getHours(); return PERIODS.find(p => h >= p.from && h < p.to).id; };

function upcomingList() {
  const out = [];
  for (let i = 1; i <= 14; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    allTasks().forEach(t => {
      if ((t.repeat.type === 'monthly' || t.repeat.type === 'once') && occursOn(t, d)) out.push({ t, date: iso(d) });
    });
  }
  return out.slice(0, 8);
}

function toggle(id) {
  if (id.startsWith('b:')) { toggleBill(id.slice(2)); if (navigator.vibrate) navigator.vibrate(10); save(); render(); return; }
  const d = todayStr(), list = S.done[d] || (S.done[d] = []);
  const i = list.indexOf(id);
  i >= 0 ? list.splice(i, 1) : list.push(id);
  if (navigator.vibrate) navigator.vibrate(10);
  save(); render();
}
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2000);
}
