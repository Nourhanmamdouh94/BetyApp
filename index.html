   Components (بترجع HTML) — نفس أسماء DESIGN-SYSTEM.md
   ========================================================= */
const Ico = (svgIcon, size = '', cat = null) => `<span class="ico ${size} ${catClass(cat)}">${svgIcon}</span>`;
const ChipIco = k => `<span class="chip-ico ${catClass(k)}">${CATS[k].icon}</span>`;
/* Chip: default / selected / disabled. لو مفيهاش أيقونة، بيظهر ✓ لما تتختار */
const Chip = ({ label, pressed, attrs = '', icon = '', count = null, role = 'pressed', disabled = false }) =>
  `<button class="chip" ${role === 'radio' ? `role="radio" aria-checked="${!!pressed}"` : `aria-pressed="${!!pressed}"`} ${disabled ? 'disabled' : ''} ${attrs}>
    ${icon || `<span class="chip-check" aria-hidden="true">${ICON.checkInk}</span>`}${label}${count !== null ? ` <span class="count">${num(count)}</span>` : ''}</button>`;
const Seg = (key, value, options, action = 'pick') =>
  `<div class="seg" role="radiogroup" style="grid-template-columns:repeat(${options.length}, 1fr)">
    ${options.map(([v, label]) => Chip({ label, pressed: String(value) === String(v), role: 'radio', attrs: `data-a="${action}" data-k="${key}" data-v="${v}"` })).join('')}</div>`;

function ring(done, total) {
  const r = 25, c = 2 * Math.PI * r, p = total ? done / total : 0;
  return `<div class="ring" role="img" aria-label="خلصتي ${num(done)} من ${num(total)}">
    <svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" fill="none" style="stroke:var(--ring-track)" stroke-width="6"/>
    <circle cx="29" cy="29" r="${r}" fill="none" style="stroke:var(--ring-fill); transition:stroke-dashoffset .4s ease" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}"/></svg>
    <b>${num(done)}/${num(total)}</b></div>`;
}

function weekStrip() {
  const sel = planDay || todayStr(), sd = fromIso(sel), start = new Date(sd);
  start.setDate(sd.getDate() - ((sd.getDay() + 1) % 7));   // الأسبوع بيبدأ السبت
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = iso(d), isToday = key === todayStr(), past = d < dayDate(0);
    const has = allTasks().some(t => notDaily(t) && occursOn(t, d)) || S.meals[key];
    return `<button class="wday ${isToday ? 'today' : ''} ${past ? 'past' : ''}" data-a="cal-day" data-v="${key}" aria-pressed="${key === sel}" aria-label="${DAY_NAME[d.getDay()]} ${fullDate(d)}" ${isToday ? 'aria-current="date"' : ''}>
      <span>${DAY_SHORT[d.getDay()]}</span><b>${num(d.getDate())}</b><i class="wdot" ${has ? '' : 'hidden'}></i></button>`;
  }).join('');
}
function weekBar() {
  const sd = fromIso(planDay || todayStr());
  return `<div class="week-bar">
    <button class="wk-month" data-a="month-open" aria-label="افتحي الشهر كله">${sd.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' })} ${ICON.chevDown}</button>
    <div class="wk-nav">
      <button class="wk-btn" data-a="week-move" data-v="-1" aria-label="الأسبوع اللي فات">${ICON.back}</button>
      <button class="wk-btn" data-a="week-move" data-v="1" aria-label="الأسبوع الجاي">${ICON.fwd}</button>
    </div>
  </div>`;
}
function renderMonthSheet() {
  monthSheet = true; calOpen = true; document.body.classList.add('locked');
  $('sheet').innerHTML = sheetWrap('اختاري يوم', `<div style="margin-top:12px">${calendar(true)}</div>`);
}

/* =========================================================
   شاشة النهارده
   ========================================================= */
function taskItem(t) {
  const done = isDone(t.id);
  return `
    <div class="li ${catClass(t.cat)} ${done ? 'is-done' : ''}">
      <button class="li-tap" data-a="detail" data-id="${t.id}" aria-label="تفاصيل: ${esc(t.title)}">
        ${Ico(CATS[t.cat].icon)}
        <span class="li-body">
          <span class="li-title">${esc(t.title)}</span>
          <span class="li-meta">${CATS[t.cat].name}، ${num(t.mins)} دقيقة${t.note ? '، ' + esc(t.note) : ''}</span>
        </span>
      </button>
      ${t.recipe && !done ? `<button class="btn btn-sm btn-soft" data-a="recipe">الوصفة</button>` : ''}
      <button class="check" data-a="toggle" data-id="${t.id}" aria-pressed="${done}" aria-label="${done ? 'رجّعي' : 'خلصت'}: ${esc(t.title)}">${ICON.check}</button>
    </div>`;
}

function viewToday() {
  if (planDay && planDay !== todayStr()) return viewDay(fromIso(planDay));
  const list = todayTasks();
  const total = list.length;
  const left = list.filter(t => !isDone(t.id));
  const curIdx = periodIndex(nowPeriod());
  const h = new Date().getHours();
  const mins = left.reduce((s, t) => s + t.mins, 0);

  const hero = `
    <header class="hero gutter"><div class="wrap">
      ${weekBar()}
      <div class="week" role="group" aria-label="أيام الأسبوع">${weekStrip()}</div>
      <div class="today-sum">
        <div class="today-info">
          <span class="today-title">يومك النهارده</span>
          <span class="today-sub">${left.length ? `باقي ${num(left.length)} مهام، حوالي ${num(mins)} دقيقة` : total ? 'خلصتي كل حاجة 🤍' : 'مفيش مهام النهارده'}</span>
        </div>
        ${ring(total - left.length, total)}
      </div>
    </div></header>`;

  const periods = PERIODS.map((p, i) => {
    const tasks = list.filter(t => t.period === p.id);
    if (!tasks.length) return '';
    const state = i === curIdx ? 'is-now' : i < curIdx ? 'is-past' : '';
    const pIcon = { morning: ICON.sunrise, noon: ICON.today, night: ICON.moon }[p.id];
    return `
      <section class="period p-${p.id} ${state}" aria-label="${p.name}">
        <span class="node" aria-hidden="true"></span>
        <div class="period-head">
          <span class="period-ico">${pIcon}</span>
          <span class="period-name">${p.name}</span>
          <span class="tag">${state === 'is-now' ? 'دلوقتي' : p.hint}</span>
        </div>
        <div class="list">${tasks.map(taskItem).join('')}</div>
      </section>`;
  }).join('');

  const cards = upcomingList()
    .map(({ t, date }) => `
      <div class="card ${catClass(t.cat)}">
        <div class="card-top">${Ico(CATS[t.cat].icon, 'ico-sm')}<span class="tag ${urgency(date)}">${whenLabel(date)}</span></div>
        <span class="card-title">${esc(t.title)}</span>
      </div>`).join('');

  return `${hero}
    <main class="screen gutter"><div class="wrap">
      <section class="block">
        <div class="section-head"><h2 class="section-title">مهام النهارده</h2></div>
        ${periods ? `<div class="day">${periods}</div>` : `<div class="empty">مفيش مهام النهارده. دوسي + فوق عشان تضيفي.</div>`}
      </section>
      ${todayMealBlock()}
      ${cards ? `<section class="block"><div class="section-head"><h2 class="section-title">المواعيد الجاية</h2></div><div class="cards">${cards}</div></section>` : ''}
    </div></main>`;
}

/* ---------- يوم تاني غير النهارده (من شريط الأسبوع أو الشهر) ---------- */
function viewDay(d) {
  const key = iso(d), items = allTasks().filter(t => occursOn(t, d));
  const special = items.filter(notDaily).length;
  const r = recipeById(S.meals[key]);
  const periods = PERIODS.map(p => {
    const tasks = items.filter(t => t.period === p.id); if (!tasks.length) return '';
    const pIcon = { morning: ICON.sunrise, noon: ICON.today, night: ICON.moon }[p.id];
    return `<section class="period p-${p.id}" aria-label="${p.name}"><span class="node" aria-hidden="true"></span>
      <div class="period-head"><span class="period-ico">${pIcon}</span><span class="period-name">${p.name}</span><span class="tag">${p.hint}</span></div>
      <div class="list">${tasks.map(t => agendaRow(t, d)).join('')}</div></section>`;
  }).join('');
  return `
    <header class="hero gutter"><div class="wrap">
      ${weekBar()}
      <div class="week" role="group" aria-label="أيام الأسبوع">${weekStrip()}</div>
      <div class="today-sum">
        <div class="today-info">
          <span class="today-title">${dayTitle(d)}، ${fullDate(d)}</span>
          <span class="today-sub">${num(items.length)} مهام${special ? `، منهم ${num(special)} مش يومية` : ''}${r ? `، والأكلة ${esc(r.name)}` : ''}</span>
        </div>
        <button class="btn btn-sm btn-primary" data-a="cal-day" data-v="${todayStr()}">ارجعي للنهارده</button>
      </div>
    </div></header>
    <main class="screen gutter"><div class="wrap">
      <section class="block">
        <div class="section-head"><h2 class="section-title">مهام اليوم ده</h2></div>
        ${periods ? `<div class="day">${periods}</div>` : `<div class="empty">مفيش مهام اليوم ده</div>`}
      </section>
      <section class="block cat-kitchen">
        <div class="section-head"><h2 class="section-title">أكلة اليوم ده</h2></div>
        <div class="li meal-row">
          ${r ? `<button class="li-tap" data-a="open-recipe" data-v="${r.id}">${Ico(ICON.kitchen)}<span class="li-body"><span class="li-title">${esc(r.name)}</span><span class="li-meta">${num(r.mins)} دقيقة</span></span></button>`
              : `${Ico(ICON.kitchen)}<span class="li-body"><span class="li-meta">لسه ما اخترتيش</span></span>`}
          <button class="btn btn-sm ${r ? 'btn-text' : 'btn-soft'}" data-a="meal-pick" data-v="${key}">${r ? 'غيّري' : 'اختاري'}</button>
        </div>
      </section>
    </div></main>`;
}

/* =========================================================
   تاب الخطة — فكرة واحدة: اختاري يوم ← شوفي خطته
   التقويم أسبوع، ويتفتح شهر كامل. والروتين صفحة لوحده.
   ========================================================= */
const notDaily = t => t.repeat.type !== 'daily';
const dayDate = off => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + off); return d; };
const fromIso = k => new Date(k + 'T00:00');
const dayTitle = d => { const n = Math.round((d - dayDate(0)) / 864e5); return n === 0 ? 'النهارده' : n === 1 ? 'بكرة' : n === -1 ? 'امبارح' : DAY_NAME[d.getDay()]; };
const fullDate = d => d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long' });

function agendaRow(t, d) {
  const done = iso(d) === todayStr() && isDone(t.id);
  return `
    <button class="li ${catClass(t.cat)} ${done ? 'is-done' : ''}" data-a="detail" data-id="${t.id}" aria-label="تفاصيل: ${esc(t.title)}">
      ${Ico(CATS[t.cat].icon)}
      <span class="li-body"><span class="li-title">${esc(t.title)}</span>
      <span class="li-meta">${CATS[t.cat].name}، ${periodName(t.period)}، ${num(t.mins)} دقيقة</span></span>
      <span class="chev">${ICON.chev}</span>
    </button>`;
}
function dayCell(d, sel) {
  const key = iso(d);
  const cats = [...new Set(allTasks().filter(t => notDaily(t) && occursOn(t, d)).map(t => t.cat))].slice(0, 3);
  const cls = (key === todayStr() ? ' is-today' : '') + (d < dayDate(0) ? ' is-past' : '');
  return `<button class="cal-d${cls}" data-a="cal-day" data-v="${key}" aria-pressed="${key === sel}" aria-label="${DAY_NAME[d.getDay()]} ${fullDate(d)}${cats.length ? '، فيه مواعيد' : ''}">
    ${num(d.getDate())}<span class="dots">${cats.map(c => `<i class="dot ${catClass(c)}"></i>`).join('')}</span></button>`;
}
function calendar(inSheet) {
  const sel = planDay || todayStr(), sd = fromIso(sel);
  let cells;
  if (calOpen) {
    const first = new Date(sd.getFullYear(), sd.getMonth(), 1);
    const days = new Date(sd.getFullYear(), sd.getMonth() + 1, 0).getDate();
    cells = Array.from({ length: (first.getDay() + 1) % 7 }, () => '<span></span>').join('') +
      Array.from({ length: days }, (_, i) => dayCell(new Date(sd.getFullYear(), sd.getMonth(), i + 1), sel)).join('');
  } else {
    const start = new Date(sd); start.setDate(sd.getDate() - ((sd.getDay() + 1) % 7));   // السبت
    cells = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return dayCell(d, sel); }).join('');
  }
  const unit = calOpen ? 'الشهر' : 'الأسبوع';
  return `
    <div class="cal">
      <div class="cal-top">
        <button class="icon-btn icon-btn-sm icon-btn-surface" data-a="cal-move" data-v="-1" aria-label="${unit} اللي فات">${ICON.back}</button>
        <div class="cal-mid">
          <b>${sd.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' })}</b>
          ${sel !== todayStr() ? `<button class="tag tag-brand" data-a="cal-day" data-v="${todayStr()}">ارجعي للنهارده</button>` : ''}
        </div>
        <button class="icon-btn icon-btn-sm icon-btn-surface" data-a="cal-move" data-v="1" aria-label="${unit} الجاي">${ICON.fwd}</button>
      </div>
      <div class="cal-grid">${WEEK.map(d => `<span class="cal-h">${DAY_SHORT[d]}</span>`).join('')}${cells}</div>
      ${inSheet ? '' : `<button class="cal-toggle" data-a="cal-open" aria-expanded="${calOpen}">${calOpen ? 'صغّري للأسبوع' : 'اعرضي الشهر كله'}${ICON.chev}</button>`}
    </div>`;
}
function dayPlan(d) {
  const items = allTasks().filter(t => notDaily(t) && occursOn(t, d)).sort((a, b) => periodIndex(a.period) - periodIndex(b.period));
  const daily = S.tasks.filter(t => !notDaily(t)).sort((a, b) => periodIndex(a.period) - periodIndex(b.period));
  return `
    <section class="block">
      <div class="section-head"><h2 class="section-title">${dayTitle(d)}، ${fullDate(d)}</h2></div>
      ${items.length ? `<div class="list">${items.map(t => agendaRow(t, d)).join('')}</div>` : `<div class="empty">مفيش مواعيد اليوم ده، الروتين اليومي بس</div>`}
    </section>
    <section class="block">
      <div class="section-head"><h2 class="section-title">الروتين اليومي</h2><span class="tag">${num(daily.length)} مهام كل يوم</span></div>
      <div class="list">${daily.map(t => agendaRow(t, d)).join('')}</div>
    </section>`;
}
function viewPlan() {
  return `
    <main class="screen screen-top gutter"><div class="wrap">
      <div class="block">${calendar()}</div>
      ${dayPlan(fromIso(planDay || todayStr()))}
    </div></main>`;
}

/* ---------- تاب البيت: كل أقسام الشغل، وكل قسم بيفتح صفحته ---------- */
function viewHouse() {   // تاب «البيت»: شغل البيت بالأقسام + بيانات البيت
  const list = todayTasks();
  const tiles = Object.entries(CATS).filter(([k]) => k !== 'bills').map(([k, c]) => {   // الفواتير بيتها تاب الفلوس
    const all = S.tasks.filter(t => t.cat === k).length;
    const rest = list.filter(t => t.cat === k && !isDone(t.id)).length;
    return `
      <button class="tile ${catClass(k)}" data-a="open-cat" data-v="${k}" aria-label="افتحي قسم ${c.name}">
        <span class="tile-name">${c.name}</span>
        <span class="tile-sub">${num(all)} مهمة</span>
        ${rest ? `<span class="tile-count" aria-label="فاضل ${num(rest)} النهارده">${num(rest)}</span>` : ''}
        <span class="tile-ill">${ILL[k]()}</span>
      </button>`;
  }).join('');
  const soon = S.home.warranties.filter(w => daysUntil(w.until) >= 0 && daysUntil(w.until) <= 60).length;
  return `
    <main class="screen screen-top gutter"><div class="wrap">
      <section class="block">
        <div class="section-head"><h2 class="section-title">شغل البيت</h2><span class="tag">${num(S.tasks.length)} مهمة بتتكرر</span></div>
        <div class="tiles tiles-2">${tiles}<button class="tile tile-add" data-a="new">${ICON.plus}ضيفي مهمة</button></div>
      </section>
      <section class="block">
        <div class="section-head"><h2 class="section-title">بيانات البيت</h2></div>
        <div class="list">
          ${navRow('open-cat', 'warranties', ICON.shield, 'organize', 'الأجهزة والضمانات', `${num(S.home.warranties.length)} أجهزة`, soon ? `<span class="tag tag-soon">${num(soon)} قرب يخلص</span><span class="chev">${ICON.chev}</span>` : undefined)}
          ${navRow('open-cat', 'contacts', ICON.phone, 'clean', 'أرقام مهمة', `${num(S.home.contacts.length)} أرقام`)}
        </div>
      </section>
    </div></main>`;
}

/* =========================================================
   شيت التفاصيل — الدوسة على مهمة بتعرضها الأول، والتعديل زرار جوه
   ========================================================= */
function nextDates(t, n = 3) {
  const out = [];
  for (let i = 0; i < 400 && out.length < n; i++) { const d = dayDate(i); if (occursOn(t, d)) out.push(d); }
  return out;
}
function openDetail(id) { viewId = id; document.body.classList.add('locked'); renderDetail(); }
function renderDetail() {
  const t = findTask(viewId); if (!t) return closeSheet();
  const isBill = !!t.bill;
  const today = occursOn(t, new Date()), done = isDone(t.id);
  const next = nextDates(t, 3);
  $('sheet').innerHTML = `
    <div class="backdrop" data-a="close-sheet"></div>
    <div class="sheet ${catClass(t.cat)}" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="handle" aria-hidden="true"></div>
      <div class="detail-head">
        ${Ico(CATS[t.cat].icon)}
        <h2 id="sheet-title">${esc(t.title)}</h2>
        <button class="icon-btn icon-btn-sm icon-btn-surface" data-a="close-sheet" aria-label="اقفلي">${ICON.close}</button>
      </div>
      <div class="detail-tags">
        <span class="tag" style="background:var(--cat-100); color:var(--cat-800)">${CATS[t.cat].name}</span>
        <span class="tag">${periodName(t.period)}</span>
        <span class="tag">${num(t.mins)} دقيقة</span>
        ${isBill ? `<span class="tag ${done ? 'tag-brand' : 'tag-accent'}">${done ? 'اتدفعت الشهر ده' : 'لسه ما اتدفعتش'}</span>` : today ? `<span class="tag ${done ? 'tag-brand' : 'tag-accent'}">${done ? 'خلصت النهارده' : 'عليكي النهارده'}</span>` : ''}
      </div>
      <dl style="margin:0">
        ${isBill ? `<div class="info"><dt>المبلغ</dt><dd>${t.note || 'من غير مبلغ'}</dd></div>` : ''}
        <div class="info"><dt>بتتكرر</dt><dd>${repeatLabel(t.repeat)}</dd></div>
        <div class="info"><dt>المرات الجاية</dt><dd>${next.length ? next.map(d => `${dayTitle(d)}، ${fullDate(d)}`).join('<br>') : 'مفيش'}</dd></div>
        ${t.note && !isBill ? `<div class="info"><dt>ملاحظة</dt><dd>${esc(t.note)}</dd></div>` : ''}
      </dl>
      <div class="sheet-actions">
        ${isBill ? `<button class="btn ${done ? 'btn-secondary' : 'btn-primary'} btn-lg" data-a="detail-toggle">${done ? 'رجّعيها مش مدفوعة' : 'دفعتها ✓'}</button>`
          : today ? `<button class="btn ${done ? 'btn-secondary' : 'btn-primary'} btn-lg" data-a="detail-toggle">${done ? 'رجّعيها مش متعملة' : 'خلصتها ✓'}</button>` : ''}
        ${t.recipe ? `<button class="btn btn-soft btn-lg" data-a="recipe">افتحي الوصفة</button>` : ''}
        <button class="btn btn-secondary btn-lg" data-a="edit-form">${isBill ? 'عدّلي الفاتورة' : 'عدّلي المهمة'}</button>
      </div>
    </div>`;
}

/* =========================================================
   الـ Sheet: إضافة وتعديل مهمة
   ========================================================= */
function openSheet(task, presetCat) {
  const now = new Date();
  draft = task ? {
    id: task.id, title: task.title, cat: task.cat, period: task.period, mins: task.mins, note: task.note || '', recipe: task.recipe,
    rtype: task.repeat.type,
    days: task.repeat.days ? [...task.repeat.days] : [now.getDay()],
    day: task.repeat.day || now.getDate(),
    date: task.repeat.date || addDays(1)
  } : {
    id: null, title: '', cat: presetCat || 'clean', period: 'morning', mins: 10, note: '',
    rtype: 'weekly', days: [now.getDay()], day: now.getDate(), date: addDays(1)
  };
  sheetError = ''; confirmDelete = false;
  document.body.classList.add('locked');
  renderSheet();
  setTimeout(() => { const f = $('f-title'); if (f && !task) f.focus(); }, 300);
}
function closeSheet() { stockId = null; stockConfirm = false; draft = null; viewId = null; form = null; picker = null; if (monthSheet) { monthSheet = false; calOpen = false; } $('sheet').innerHTML = ''; document.body.classList.remove('locked'); }

function renderSheet() {
  if (!draft) return;
  const d = draft;
  let repeatExtra = '';
  if (d.rtype === 'weekly') {
    repeatExtra = `<div class="chip-grid is-even" style="grid-template-columns:repeat(7, 1fr); margin-top:10px" role="group" aria-label="أيام التكرار">
      ${WEEK.map(w => Chip({ label: DAY_SHORT[w], pressed: d.days.includes(w), attrs: `data-a="pick-day" data-v="${w}"` })).join('')}</div>`;
  } else if (d.rtype === 'monthly') {
    repeatExtra = `<label class="field-label" for="f-day">يوم كام في الشهر؟</label>
      <select class="input" id="f-day" data-f="day">${Array.from({ length: 31 }, (_, i) => i + 1).map(n =>
        `<option value="${n}" ${d.day === n ? 'selected' : ''}>يوم ${num(n)}</option>`).join('')}</select>`;
  } else if (d.rtype === 'once') {
    repeatExtra = `<label class="field-label" for="f-date">إمتى؟</label>
      <input class="input" type="date" id="f-date" data-f="date" value="${d.date}" min="${todayStr()}">`;
  }

  $('sheet').innerHTML = `
    <div class="backdrop" data-a="close-sheet"></div>

function saveDraft() {
  const d = draft;
  d.title = d.title.trim();
  if (!d.title) { sheetError = 'title'; renderSheet(); $('f-title').focus(); return; }
  if (d.rtype === 'weekly' && !d.days.length) { sheetError = 'days'; renderSheet(); return; }
  const repeat = d.rtype === 'daily' ? { type: 'daily' }
               : d.rtype === 'weekly' ? { type: 'weekly', days: [...d.days] }
               : d.rtype === 'monthly' ? { type: 'monthly', day: Number(d.day) }
               : { type: 'once', date: d.date || addDays(1) };
  const task = { id: d.id || 't' + Date.now(), title: d.title, cat: d.cat, period: d.period, mins: Number(d.mins), note: d.note.trim(), repeat };
  if (d.recipe) task.recipe = true;
  const i = S.tasks.findIndex(t => t.id === task.id);
  i >= 0 ? (S.tasks[i] = task) : S.tasks.push(task);
  save(); closeSheet(); render();
  toast(i < 0 ? 'اتضافت المهمة' : 'اتحفظ التعديل');
}
function deleteDraft() {
  const id = draft.id;
  askConfirm({ title: `تمسحي «${draft.title || 'المهمة'}»؟`, onOk: () => {
    S.tasks = S.tasks.filter(t => t.id !== id);
    save(); closeSheet(); render(); toast('اتمسحت المهمة');
  } });
}

function upgrade(s) {
  const d = seedExtra();
  ['recipes', 'meals', 'shop', 'home'].forEach(k => { if (!s[k]) s[k] = d[k]; });
  if (!s.learn) { s.learn = seedLearn(); newRecipes().forEach(r => { if (!s.recipes.some(x => x.id === r.id)) s.recipes.push(r); }); }
  if (!s.money) {
    const old = s.tasks.filter(t => t.cat === 'bills');
    s.money = { budget: d.money.budget, expenses: [], bills: old.length ? old.map(t => {
      const name = t.title.replace(/^(دفع|تجديد)\s+/, '');
      const known = d.money.bills.find(b => b.name === name);
      return { id: uid('b'), name, amount: known ? known.amount : 0, day: t.repeat.day || 1, paid: {} };
    }) : d.money.bills };
  }
  s.tasks = s.tasks.filter(t => t.cat !== 'bills');   // الفاتورة بيتها الفلوس دلوقتي
  return upgradeLists(s);
}

/* ---------- الفواتير بتظهر في النهارده والخطة كأنها مهام (عرض بس، بيتها الفلوس) ---------- */
const billTasks = () => S.money.bills.map(b => ({
  id: 'b:' + b.id, title: 'دفع ' + b.name, cat: 'bills', period: 'noon', mins: 5,
  repeat: { type: 'monthly', day: b.day }, note: b.amount ? money(b.amount) : '', bill: b.id
}));
const allTasks = () => S.tasks.concat(billTasks());
const findTask = id => allTasks().find(t => t.id === id);
const billPaid = (b, m = monthKey()) => !!(b.paid && b.paid[m]);

function toggleBill(bid) {
  const b = S.money.bills.find(x => x.id === bid), m = monthKey();
  if (billPaid(b)) {
    delete b.paid[m];
    S.money.expenses = S.money.expenses.filter(e => !(e.bill === bid && e.month === m));
  } else {
    b.paid = b.paid || {}; b.paid[m] = true;
    if (b.amount) S.money.expenses.push({ id: uid('e'), amount: b.amount, cat: 'bills', note: b.name, date: todayStr(), bill: bid, month: m });
  }
}

/* =========================================================
   Sheet عام — أي فورم بسيط (مصروف، فاتورة، وصفة، جهاز، رقم...)
   ========================================================= */
let form = null;
const sheetWrap = (title, body, cls = '') => `
  <div class="backdrop" data-a="close-sheet"></div>
  <div class="sheet ${cls}" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">${title}</h2>
      <button class="icon-btn icon-btn-sm icon-btn-surface" data-a="close-sheet" aria-label="اقفلي">${ICON.close}</button>
    </div>${body}
  </div>`;

function openForm(cfg) {
  form = { ...cfg, values: { ...cfg.values }, confirmDel: false, error: null };
  document.body.classList.add('locked'); renderForm();
  setTimeout(() => { const f = document.querySelector('#sheet [data-ff]'); if (f && !cfg.editing) f.focus(); }, 300);
}
function renderForm() {
  const f = form, v = f.values;
  const fields = f.fields.map(fd => {
    const err = f.error === fd.k ? `<div class="field-error">${fd.err || 'المكان ده مطلوب'}</div>` : '';
    if (fd.type === 'chips') return `<span class="field-label">${fd.label}</span>
      <div class="chip-grid" style="grid-template-columns:repeat(${fd.cols || 3}, 1fr)" role="radiogroup">
        ${fd.options.map(([val, label, cat]) => Chip({ label, icon: cat ? ChipIco(cat) : '', pressed: String(v[fd.k]) === String(val), role: 'radio', attrs: `data-a="ff-pick" data-k="${fd.k}" data-v="${val}"` })).join('')}</div>${err}`;
    if (fd.type === 'textarea') return `<label class="field-label" for="ff-${fd.k}">${fd.label}</label>
      <textarea class="input ${err ? 'is-error' : ''}" id="ff-${fd.k}" data-ff="${fd.k}" placeholder="${fd.ph || ''}" rows="${fd.rows || 4}">${esc(v[fd.k] || '')}</textarea>${err}`;
    return `<label class="field-label" for="ff-${fd.k}">${fd.label}</label>
      <input class="input ${err ? 'is-error' : ''}" id="ff-${fd.k}" data-ff="${fd.k}" type="${fd.type || 'text'}" ${fd.type === 'number' ? 'inputmode="numeric" min="0"' : ''} value="${esc(v[fd.k] ?? '')}" placeholder="${fd.ph || ''}" autocomplete="off">${err}`;
  }).join('');
  $('sheet').innerHTML = sheetWrap(f.title, `${fields}
    <div class="sheet-actions">
      <button class="btn btn-primary btn-lg" data-a="ff-save">${f.saveLabel || 'احفظي'}</button>
      ${f.onDelete ? `<button class="btn btn-destructive btn-lg" data-a="ff-delete">${f.deleteLabel || 'امسحي'}</button>` : ''}
    </div>`);
}
function saveForm() {
  const f = form, v = f.values;
  const miss = f.fields.find(fd => fd.required && !String(v[fd.k] ?? '').trim());
  if (miss) { f.error = miss.k; renderForm(); return; }
  const bad = f.fields.find(fd => fd.type === 'number' && fd.required && !(Number(v[fd.k]) > 0));
  if (bad) { f.error = bad.k; bad.err = 'اكتبي رقم أكبر من صفر'; renderForm(); return; }
  const msg = f.onSave(v);
  save(); closeSheet(); render(); toast(msg || 'اتحفظ');
}

function mealsToShop(dates) {
  let added = 0;
  dates.forEach(k => {
    const r = recipeById(S.meals[k]); if (!r) return;
    r.ing.forEach(i => {
      if (BASICS.test(i.n)) return;
      const have = S.shop.items.some(x => !x.done && x.name === i.n);
      const stocked = S.shop.stock.some(x => x.name === i.n && x.state === 'ok');
      if (have || stocked) return;
      S.shop.items.push({ id: uid('i'), name: i.n, qty: i.q, sec: i.sec || guessSec(i.n), list: mainList(), done: false, from: r.name });
      added++;
    });
  });
  return added;
}

function mealNeeds(r) {
  return r.ing.filter(i => !BASICS.test(i.n)).map((i, idx) => {
    const item = S.shop.items.find(x => x.name === i.n && !x.done) || S.shop.items.find(x => x.name === i.n);
    const stocked = S.shop.stock.some(x => x.name === i.n && x.state === 'ok');
    const state = item ? (item.done ? 'bought' : 'need') : stocked ? 'have' : 'missing';
    return { i, idx, item, state };
  });
}
function todayMealBlock() {
  const r = recipeById(S.meals[todayStr()]);
  if (!r) return `
    <section class="block">
      <div class="section-head"><h2 class="section-title">مشتريات أكلة النهارده</h2></div>
      <div class="meal-card meal-empty cat-kitchen">
        <span class="meal-ill">${ILL.kitchen()}</span>
        <span class="meal-empty-text">لسه ما اخترتيش هتطبخي إيه النهارده</span>
        <button class="btn btn-primary btn-sm" data-a="meal-pick" data-v="${todayStr()}">اختاري الأكلة</button>
      </div>
    </section>`;
  const needs = mealNeeds(r);
  const ready = needs.filter(n => n.state === 'have' || n.state === 'bought').length;
  const missing = needs.filter(n => n.state === 'missing').length;
  const order = { missing: 0, need: 1, bought: 2, have: 3 };
  const LABEL = { missing: 'ناقص، دوسي تضيفيه', need: 'في القايمة، دوسي لما تشتريه', bought: 'اشتريتيه', have: 'عندك في المخزن' };
  const ICO = { missing: ICON.plus, need: ICON.cart, bought: ICON.checkInk, have: ICON.checkInk };
  const chips = needs.sort((a, b) => order[a.state] - order[b.state]).map(({ i, idx, item, state }) => {
    const act = state === 'missing' ? `data-a="ing-add" data-v="${idx}"` : item ? `data-a="item-toggle" data-v="${item.id}"` : 'disabled';
    return `<button class="ing-chip is-${state}" ${act} aria-label="${esc(i.n)}: ${LABEL[state]}" title="${esc(i.q)}">${ICO[state]}<span>${esc(i.n)}</span></button>`;
  }).join('');
  return `
    <section class="block">
      <div class="section-head"><h2 class="section-title">مشتريات أكلة النهارده</h2></div>
      <div class="meal-card cat-kitchen">
        <button class="meal-top" data-a="today-recipe" aria-label="افتحي وصفة ${esc(r.name)}">
          <span class="meal-ill">${ILL.kitchen()}</span>
          <span class="meal-info"><span class="meal-kicker">أكلة النهارده</span><b>${esc(r.name)}</b><span class="meal-sub">${num(r.mins)} دقيقة، لشخصين</span></span>
          <span class="chev">${ICON.chev}</span>
        </button>
        <div class="meal-progress">
          <span>${ready === needs.length ? 'كل المكونات جاهزة ✓' : `جاهز ${num(ready)} من ${num(needs.length)} مكونات`}</span>
          <span class="bar"><i style="width:${needs.length ? ready / needs.length * 100 : 0}%"></i></span>
        </div>
        <div class="ing-chips">${chips}</div>
        <div class="ing-legend"><span><i class="lg lg-missing"></i>ناقص</span><span><i class="lg lg-need"></i>في القايمة</span><span><i class="lg lg-ok"></i>جاهز</span></div>
        ${missing ? `<button class="btn btn-primary btn-lg" style="margin-top:14px" data-a="ing-add-all">${ICON.cart}ضيفي الناقص للقايمة (${num(missing)})</button>` : ''}
      </div>
    </section>`;
}

const ingToText = r => r.ing.map(i => `${i.n} - ${i.q}`).join('\n');
const stepsToText = r => r.steps.map(s => s.min ? `${s.t} [${s.min}]` : s.t).join('\n');
function openRecipeForm(r) {
  openForm({
    title: r ? 'تعديل الوصفة' : 'وصفة جديدة', editing: !!r, saveLabel: r ? 'احفظي التعديل' : 'ضيفي الوصفة',
    values: r ? { name: r.name, mins: r.mins, level: r.level, ing: ingToText(r), steps: stepsToText(r), tip: r.tip || '' } : { name: '', mins: 30, level: 'سهلة', ing: '', steps: '', tip: '' },
    fields: [
      { k: 'name', label: 'اسم الأكلة', ph: 'مثلاً: محشي كرنب', required: true },
      { k: 'mins', label: 'بتاخد كام دقيقة؟', type: 'number', required: true },
      { k: 'level', label: 'صعوبتها', type: 'chips', options: [['سهلة', 'سهلة'], ['متوسطة', 'متوسطة'], ['صعبة', 'صعبة']] },
      { k: 'ing', label: 'المكونات لشخصين (كل مكون في سطر: الاسم - الكمية)', type: 'textarea', ph: 'رز مصري - كوباية\nبصل - بصلة', required: true, rows: 5 },
      { k: 'steps', label: 'الخطوات (كل خطوة في سطر، ولو ليها وقت اكتبيه كده [١٠])', type: 'textarea', ph: 'اغسلي الرز\nسيبيه يستوي على نار هادية [15]', required: true, rows: 5 },
      { k: 'tip', label: 'نصيحة (اختياري)', ph: 'حاجة اتعلمتيها' }
    ],
    onSave: v => {
      const toN = s => Number(String(s).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)));
      const ing = v.ing.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [n, ...q] = l.split(/\s+-\s+|\s*:\s*/); return { n: n.trim(), q: q.join(' ').trim() || 'حسب ذوقك', sec: guessSec(n) }; });
      const steps = v.steps.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/\[([\d٠-٩]+)\]\s*$/); return { t: l.replace(/\s*\[[\d٠-٩]+\]\s*$/, ''), min: m ? toN(m[1]) : 0 }; });
      const data = { name: v.name.trim(), mins: toN(v.mins), level: v.level, ing, steps, tip: v.tip.trim() };
      if (r) { Object.assign(r, data); return 'اتحفظت الوصفة'; }
      const nr = { id: uid('r'), status: 'want', ...data }; S.recipes.push(nr); return 'اتضافت الوصفة';
    },
    onDelete: r ? () => { S.recipes = S.recipes.filter(x => x.id !== r.id); Object.keys(S.meals).forEach(k => { if (S.meals[k] === r.id) delete S.meals[k]; }); page = 'kitchen'; prevPage = null; return 'اتمسحت الوصفة'; } : null
  });
}

/* ---------- وضع الطبخ: خطوة في كل شاشة + تايمر + الشاشة ما تطفيش ---------- */
let cook = null, wakeLock = null;
function startCook(id) {
  cook = { id, step: 0, end: null, left: null, total: 0 };
  document.body.classList.add('locked');
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
  renderCook();
}
function stopCook() {
  clearInterval(cook && cook.tick); cook = null; $('cook').innerHTML = ''; $('cook').hidden = true;
  document.body.classList.remove('locked');
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
}
const mmss = s => num(Math.floor(s / 60)) + ':' + num(s % 60).padStart(2, '٠');
function renderCook() {
  const r = recipeById(cook.id), s = r.steps[cook.step], last = cook.step === r.steps.length - 1;
  const running = cook.end !== null, left = running ? Math.max(0, Math.round((cook.end - Date.now()) / 1000)) : (cook.left ?? s.min * 60);
  const total = s.min * 60, c = 2 * Math.PI * 70;
  $('cook').hidden = false;
  $('cook').innerHTML = `
    <div class="cook-in cat-kitchen" role="dialog" aria-modal="true" aria-label="وضع الطبخ">
      <div class="cook-top">
        <button class="icon-btn icon-btn-sm icon-btn-surface" data-a="cook-close" aria-label="اقفلي وضع الطبخ">${ICON.close}</button>
        <span class="cook-title">${esc(r.name)}</span>
        <span class="tag">${num(cook.step + 1)} من ${num(r.steps.length)}</span>
      </div>
      <div class="bar" aria-hidden="true"><i style="width:${(cook.step + 1) / r.steps.length * 100}%"></i></div>
      <div class="cook-body">
        <span class="cook-n">الخطوة ${num(cook.step + 1)}</span>
        <p class="cook-text">${esc(s.t)}</p>
        ${s.min ? `
        <div class="timer" role="timer" aria-live="off">
          <svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" fill="none" style="stroke:var(--timer-track)" stroke-width="10"/>
            <circle id="tm-ring" cx="80" cy="80" r="70" fill="none" style="stroke:var(--timer-fill)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - left / total)}"/></svg>
          <b id="tm-text">${mmss(left)}</b>
        </div>
        <button class="btn ${running ? 'btn-secondary' : 'btn-soft'}" data-a="cook-timer">${running ? 'وقّفي التايمر' : left === 0 ? 'التايمر خلص، شغليه تاني' : left < total ? 'كمّلي التايمر' : `شغّلي تايمر ${num(s.min)} دقيقة`}</button>` : ''}
      </div>
      <div class="cook-nav">
        <button class="btn btn-secondary" data-a="cook-step" data-v="-1" ${cook.step === 0 ? 'disabled' : ''}>اللي قبلها</button>
        <button class="btn btn-primary" data-a="${last ? 'cook-done' : 'cook-step'}" data-v="1">${last ? 'خلصت الطبخ ✓' : 'الخطوة الجاية'}</button>
      </div>
    </div>`;
}
function cookTimer() {
  const s = recipeById(cook.id).steps[cook.step];
  if (cook.end !== null) { cook.left = Math.max(0, Math.round((cook.end - Date.now()) / 1000)); cook.end = null; clearInterval(cook.tick); renderCook(); return; }
  const left = cook.left && cook.left > 0 ? cook.left : s.min * 60;
  cook.end = Date.now() + left * 1000; cook.left = null;
  clearInterval(cook.tick);
  cook.tick = setInterval(() => {
    if (!cook) return;
    const l = Math.max(0, Math.round((cook.end - Date.now()) / 1000)), c = 2 * Math.PI * 70;
    const t = $('tm-text'), ring = $('tm-ring');
    if (t) t.textContent = mmss(l);
    if (ring) ring.style.strokeDashoffset = c * (1 - l / (s.min * 60));
    if (l === 0) { clearInterval(cook.tick); cook.end = null; cook.left = 0; beep(); renderCook(); toast('التايمر خلص ⏰'); }
  }, 500);
  renderCook();
}
function beep() {
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
  if (!prefs().sound) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .2); });
  } catch (e) {}
}

/* =========================================================
   المشتريات — قايمة الأسبوع / التموين الشهري / المخزن (جوه صفحة قسم المشتريات)
   ========================================================= */
/* =========================================================
   المشتريات — قوايم بتعمليها بنفسك، وبتتحفظ وتتجدد لوحدها
   كل قايمة: اسم + بتتجدد إمتى (كل أسبوع / كل شهر / يدوي)
   «بتتجدد» = الحاجات بتفضل في القايمة، والعلامات بس بتترجع فاضية
   ========================================================= */
let shopView = 'week', shopNew = '', shopQty = '', listEdit = false;
const RENEW = [['weekly', 'كل أسبوع'], ['monthly', 'كل شهر'], ['manual', 'لما أقول']];
const RENEW_NAME = Object.fromEntries(RENEW);
const LIST_COLORS = ['shop', 'clean', 'kitchen', 'organize', 'events', 'bills'];
const listById = id => S.shop.lists.find(l => l.id === id);
const mainList = () => (listById('week') || S.shop.lists[0] || {}).id;   // الحاجات اللي بتتبعت أوتوماتيك بتروح هنا
const weekKey = (d = new Date()) => { const s = new Date(d); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() - ((s.getDay() + 1) % 7)); return iso(s); };
const periodKey = l => l.renew === 'weekly' ? weekKey() : l.renew === 'monthly' ? monthKey() : '';

/** أول مرة: نحوّل «الأسبوع» و«الشهر» القدام لقوايم */
function upgradeLists(s) {
  if (!s.shop.lists) s.shop.lists = [
    { id: 'week', name: 'قايمة الأسبوع', renew: 'weekly', color: 'shop' },
    { id: 'month', name: 'التموين الشهري', renew: 'monthly', color: 'kitchen' }
  ];
  s.shop.lists.forEach(l => { if (l.period === undefined) l.period = l.renew === 'weekly' ? weekKey() : l.renew === 'monthly' ? monthKey() : ''; });
  return s;
}
/** لما يبدأ أسبوع أو شهر جديد: العلامات بترجع فاضية والحاجات بتفضل */
function renewLists() {
  let n = 0;
  S.shop.lists.forEach(l => {
    const k = periodKey(l);
    if (k && l.period !== k) { S.shop.items.forEach(i => { if (i.list === l.id) i.done = false; }); l.period = k; n++; }
  });
  if (n) save();
}

function shopRow(i) {
  const del = listEdit && shopView !== 'stock';
  return `
    <div class="li ${i.done && !del ? 'is-done' : ''}">
      ${del ? `<button class="del-btn" data-a="item-del" data-v="${i.id}" aria-label="امسحي ${esc(i.name)}">${ICON.minus}</button>` : ''}
      <button class="li-tap" data-a="item-edit" data-v="${i.id}" aria-label="عدّلي: ${esc(i.name)}">
        <span class="li-body"><span class="li-title">${esc(i.name)}</span><span class="li-meta">${esc(i.qty || '')}${i.from ? `${i.qty ? '، ' : ''}عشان ${esc(i.from)}` : ''}</span></span>
      </button>
      ${del ? '' : `<button class="check" data-a="item-toggle" data-v="${i.id}" aria-pressed="${i.done}" aria-label="${i.done ? 'رجّعيها' : 'اشتريتها'}: ${esc(i.name)}">${ICON.check}</button>`}
    </div>`;
}
/* الإضافة خطوة واحدة: الاسم والكمية جنب بعض، والقسم بيتحدد لوحده من الاسم */
const addRow = (ph, withQty) => `
  <div class="add-row">
    <input class="input add-name" id="shop-new" data-sf="new" value="${esc(shopNew)}" placeholder="${ph}" aria-label="${ph}" autocomplete="off" enterkeyhint="${withQty ? 'next' : 'done'}">
    ${withQty ? `<input class="input add-qty" id="shop-qty" data-sf="qty" value="${esc(shopQty)}" placeholder="الكمية" aria-label="الكمية" autocomplete="off" enterkeyhint="done">` : ''}
    <button class="icon-btn icon-btn-primary" data-a="shop-add" aria-label="ضيفي">${ICON.plus}</button>
  </div>`;

/* ---------- تاب المشتريات: قوايمي + المخزن ---------- */
function viewShopping() {
  const cards = S.shop.lists.map(l => {
    const items = S.shop.items.filter(i => i.list === l.id), left = items.filter(i => !i.done).length;
    return `
      <button class="list-card cat-${l.color || 'shop'}" data-a="open-list" data-v="${l.id}">
        <span class="list-card-top">${Ico(ICON.cart)}<span class="tag">${RENEW_NAME[l.renew]}</span></span>
        <b>${esc(l.name)}</b>
        <span class="list-card-meta">${items.length ? (left ? `فاضل ${num(left)} من ${num(items.length)}` : 'اشتريتي كله ✓') : 'فاضية'}</span>
        <span class="bar"><i style="width:${items.length ? (items.length - left) / items.length * 100 : 0}%"></i></span>

  return `<main class="screen screen-top gutter"><div class="wrap">

      <div class="list">${navRow('open-list', 'stock', ICON.box, 'kitchen', 'اللي عندي في البيت', low ? `${num(low)} حاجات قربت تخلص أو خلصت` : 'كله موجود', low ? `<span class="tag tag-soon">${num(low)}</span><span class="chev">${ICON.chev}</span>` : undefined)}</div>
    </section>
  </div></main>`;

/* ---------- صفحة القايمة ---------- */
function viewList(id) {
  if (id === 'stock') return viewStock();
  const l = listById(id); if (!l) { page = null; return viewShopping(); }
  const items = S.shop.items.filter(i => i.list === id);
  const left = items.filter(i => !i.done), done = items.filter(i => i.done);
  const rows = arr => SECTIONS.map(([k, name]) => {
    const g = arr.filter(i => i.sec === k);
    return g.length ? `<div class="sub-head">${name}<span>${num(g.length)}</span></div><div class="list">${g.map(shopRow).join('')}</div>` : '';
  }).join('');
  if (listEdit) return `<main class="screen screen-top gutter"><div class="wrap cat-${l.color || 'shop'}">
    ${items.length ? rows(items) : '<div class="empty">القايمة فاضية</div>'}
    <div class="sheet-actions">
      <button class="btn btn-secondary btn-lg" data-a="list-settings" data-v="${id}">${ICON.edit}إعدادات القايمة</button>
      ${items.length ? `<button class="btn btn-destructive btn-lg" data-a="list-empty" data-v="${id}">امسحي كل الحاجات</button>` : ''}
    </div>
  </div></main>`;
  return `<main class="screen screen-top gutter"><div class="wrap cat-${l.color || 'shop'}">
    ${addRow('ضيفي حاجة', true)}
    ${left.length ? rows(left) : items.length ? '<div class="empty">اشتريتي كل حاجة 🎉</div>' : ''}
    ${done.length ? `<div class="list done-list">${done.map(shopRow).join('')}</div>
      <button class="btn btn-secondary btn-lg" style="margin-top:16px" data-a="list-renew" data-v="${id}">${ICON.refresh}ابدئي من جديد</button>` : ''}
  </div></main>`;
}

function viewStock() {
  const main = listById(mainList());
  const ORDER = [['out', 'خلص'], ['low', 'قرب يخلص'], ['ok', 'موجود']];
  const row = x => {
    const inList = S.shop.items.some(i => !i.done && i.name === x.name);
    return `
      <div class="li stock-row">
        ${listEdit ? `<button class="del-btn" data-a="stock-del" data-v="${x.id}" aria-label="امسحي ${esc(x.name)}">${ICON.minus}</button>` : ''}
        <button class="li-tap" data-a="stock-open" data-v="${x.id}" aria-label="${esc(x.name)}: ${STOCK[x.state][0]}، دوسي عشان تغيري الحالة">
          <span class="li-body"><span class="li-title">${esc(x.name)}</span>${inList && x.state !== 'ok' ? `<span class="li-meta">في القايمة ✓</span>` : ''}</span>
          <span class="tag stock-tag ${STOCK[x.state][1]}"><i class="sdot"></i>${STOCK[x.state][0]}</span>
          ${listEdit ? '' : `<span class="chev">${ICON.chev}</span>`}
        </button>
      </div>`;
  };
  const groups = ORDER.map(([k, name]) => {
    const g = S.shop.stock.filter(x => x.state === k);
    return g.length ? `<div class="sub-head">${name}<span>${num(g.length)}</span></div><div class="list">${g.map(row).join('')}</div>` : '';
  }).join('');
  const out = S.shop.stock.filter(x => x.state === 'out').length, low = S.shop.stock.filter(x => x.state === 'low').length;
  return `<main class="screen screen-top gutter"><div class="wrap cat-kitchen">
    <div class="stock-sum">
      <span class="tag tag-urgent"><i class="sdot"></i>${num(out)} خلص</span>
      <span class="tag tag-soon"><i class="sdot"></i>${num(low)} قرب يخلص</span>
      <span class="tag tag-done"><i class="sdot"></i>${num(S.shop.stock.length - out - low)} موجود</span>
    </div>
    ${listEdit ? '' : addRow('ضيفي للمخزن')}
    ${groups || '<div class="empty">المخزن فاضي</div>'}
  </div></main>`;
}

/* =========================================================
   تاب الفلوس — الميزانية، الفواتير، المصاريف
   ========================================================= */
function viewMoney() {
  const m = monthKey(), now = new Date();
  const exps = S.money.expenses.filter(e => e.date.slice(0, 7) === m).sort((a, b) => b.date.localeCompare(a.date));
  const spent = exps.reduce((s, e) => s + Number(e.amount), 0), budget = Number(S.money.budget) || 0;
  const left = budget - spent, pct = budget ? Math.min(100, spent / budget * 100) : 0;
  const daysLeft = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate() + 1;
  const unpaid = S.money.bills.filter(b => !billPaid(b)).reduce((s, b) => s + Number(b.amount || 0), 0);

  const byCat = EXP_CATS.map(([k, n, c]) => [k, n, c, exps.filter(e => e.cat === k).reduce((s, e) => s + Number(e.amount), 0)]).filter(x => x[3] > 0).sort((a, b) => b[3] - a[3]);
  const maxCat = byCat.length ? byCat[0][3] : 1;

  const bills = S.money.bills.slice().sort((a, b) => a.day - b.day).map(b => {
    const paid = billPaid(b);
    const due = new Date(now.getFullYear(), now.getMonth(), Math.min(b.day, new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate()));
    const n = daysUntil(iso(due));
    const state = paid ? 'اتدفعت' : n < 0 ? `متأخرة ${num(-n)} يوم` : n === 0 ? 'النهارده' : `بعد ${num(n)} يوم`;
    return `
      <div class="li cat-bills ${paid ? 'is-done' : ''}">
        <button class="li-tap" data-a="detail" data-id="b:${b.id}" aria-label="تفاصيل: ${esc(b.name)}">
          ${Ico(CATS.bills.icon)}
          <span class="li-body"><span class="li-title">${esc(b.name)}</span><span class="li-meta">${b.amount ? money(b.amount) : 'من غير مبلغ'}، يوم ${num(b.day)}</span></span>
        </button>
        ${!paid ? `<span class="tag ${n < 0 ? 'tag-urgent' : n <= 4 ? 'tag-soon' : 'tag-later'}">${state}</span>` : ''}
        <button class="check" data-a="toggle" data-id="b:${b.id}" aria-pressed="${paid}" aria-label="${paid ? 'رجّعيها مش مدفوعة' : 'دفعتها'}: ${esc(b.name)}">${ICON.check}</button>
      </div>`;
  }).join('');

  let lastDate = '';
  const list = exps.map(e => {
    const head = e.date !== lastDate ? `<div class="sub-head">${dayTitle(fromIso(e.date))}، ${fullDate(fromIso(e.date))}</div>` : '';
    lastDate = e.date;
    return `${head}
      <button class="li ${catClass(EXP[e.cat].cat)}" data-a="exp-edit" data-v="${e.id}">
        ${Ico(e.cat === 'bills' ? CATS.bills.icon : e.cat === 'food' ? ICON.kitchen : e.cat === 'transport' ? ICON.car : e.cat === 'out' ? ICON.heart : e.cat === 'home' ? ICON.house : ICON.wallet)}
        <span class="li-body"><span class="li-title">${esc(e.note || EXP[e.cat].name)}</span><span class="li-meta">${EXP[e.cat].name}</span></span>
        <b class="amount">${money(e.amount)}</b>
      </button>`;
  }).join('');

  return `
    <header class="hero hero-tuck gutter"><div class="wrap">
      <div class="page-hero">
        <div class="page-text"><p>${now.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' })}، فاضل ${num(daysLeft)} يوم في الشهر</p></div>
      </div>
      <button class="budget tuck" data-a="budget-edit" aria-label="ميزانية الشهر، دوسي عشان تعدليها">
        <span class="budget-top"><span>${left >= 0 ? 'فاضل معاكي' : 'صرفتي زيادة'}</span><span class="budget-edit">${ICON.edit}</span></span>
        <b class="budget-num">${money(Math.abs(left))}</b>
        <span class="bar bar-on-brand" aria-hidden="true"><i style="width:${pct}%"></i></span>
        <span class="budget-foot"><span>صرفتي ${money(spent)}</span><span>من ${money(budget)}</span></span>
        ${unpaid ? `<span class="budget-note">منهم ${money(unpaid)} فواتير لسه ما اتدفعتش</span>` : ''}
      </button>
    </div></header>
    <main class="screen gutter"><div class="wrap">
      <button class="btn btn-primary btn-lg" data-a="exp-new">${ICON.plus}سجّلي مصروف</button>
      <section class="block" style="margin-top:24px">
        <div class="section-head"><h2 class="section-title">الفواتير</h2><button class="btn btn-text btn-sm" data-a="bill-new">${ICON.plus}ضيفي فاتورة</button></div>
        <div class="list">${bills || '<div class="empty">مفيش فواتير لسه</div>'}</div>
      </section>
      ${byCat.length ? `<section class="block">
        <div class="section-head"><h2 class="section-title">صرفتي على إيه؟</h2></div>
        <div class="cats-bars">${byCat.map(([k, n, c, v]) => `
          <div class="cbar ${catClass(c)}"><span class="cbar-name">${n}</span><span class="bar"><i style="width:${v / maxCat * 100}%"></i></span><b>${money(v)}</b></div>`).join('')}</div>
      </section>` : ''}
      <section class="block">
        <div class="section-head"><h2 class="section-title">مصاريف الشهر</h2><span class="tag">${num(exps.length)}</span></div>
        ${list ? `<div class="list">${list}</div>` : '<div class="empty">لسه ما سجلتيش مصاريف الشهر ده</div>'}
      </section>
    </div></main>`;
}

/** تذكيرات بسيطة بتطلع لما التطبيق يتفتح (مرة واحدة في اليوم) */
function dailyReminders() {
  const p = prefs();
  if (notifState() !== 'granted' || S.lastNotif === todayStr()) return;
  const msgs = [];
  if (p.morning) { const n = todayTasks().filter(t => !isDone(t.id)).length; if (n) msgs.push(`عندك ${num(n)} مهام النهارده`); }
  if (p.bills) S.money.bills.forEach(b => { const d = new Date(); d.setDate(d.getDate() + 1); if (!billPaid(b) && d.getDate() === b.day) msgs.push(`${b.name} ميعادها بكرة`); });
  if (p.warranty) S.home.warranties.forEach(w => { const n = daysUntil(w.until); if (n >= 0 && n <= 60) msgs.push(`ضمان ${w.name} فاضل عليه ${num(n)} يوم`); });
  if (!msgs.length) return;
  S.lastNotif = todayStr(); save();
  const show = r => r.showNotification('دفتر البيت', { body: msgs.join('\n'), icon: 'icons/icon-192.png', lang: 'ar', dir: 'rtl' });
  if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(show).catch(() => {});
  else try { new Notification('دفتر البيت', { body: msgs.join('\n'), lang: 'ar', dir: 'rtl' }); } catch (e) {}
}

  const ds = e.target.dataset || {};
  if (ds.ff && form) { form.values[ds.ff] = e.target.value; if (form.error === ds.ff && e.target.value.trim()) { form.error = null; e.target.classList.remove('is-error'); } return; }
  if (ds.sf) { if (type === "input") { if (ds.sf === 'qty') shopQty = e.target.value; else shopNew = e.target.value; } return; }   // الـ change بيوصل بعد ما الخانة اتمسحت، فبنتجاهله
  if (type === 'change' && e.target.id === 'restore-file' && e.target.files[0]) {
    e.target.files[0].text().then(txt => {
      try { const data = JSON.parse(txt); if (!Array.isArray(data.tasks)) throw 0; S = upgrade(data); save(); render(); toast('رجعت النسخة'); }
      catch (err) { toast('الملف ده مش نسخة من دفتر البيت'); }
    });
    return;
  }
  const f = ds.f;
  if (!f || !draft) return;
  draft[f] = f === 'day' ? Number(e.target.value) : e.target.value;
  if (f === 'title' && sheetError === 'title' && e.target.value.trim()) { sheetError = ''; e.target.classList.remove('is-error'); }
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (dialog) closeDialog(); else if (cook) stopCook(); else if (draft || form || viewId || picker) closeSheet(); }
  if (e.key === 'Enter' && e.target.id === 'shop-new') { e.preventDefault(); const q = $('shop-qty'); if (q && e.target.value.trim()) q.focus(); else addShop(e.target.value, q ? q.value : ''); }   // Enter في الاسم يودّي للكمية
  if (e.key === 'Enter' && e.target.id === 'shop-qty') { e.preventDefault(); addShop(($('shop-new') || {}).value || shopNew, e.target.value); }
});

// السكرول بقى جوه #scroller مش الصفحة
const scroller = $('scroller');
function toTop() { scroller.scrollTop = 0; }
scroller.addEventListener('scroll', () => { const b = $('appbar'); if (b) b.classList.toggle('is-scrolled', scroller.scrollTop > 4); }, { passive: true });
/* اسحبي الشيت لتحت عشان تقفليه */
(() => {
  let y0 = null, sheet = null;
  document.addEventListener('touchstart', e => {
    const h = e.target.closest('.handle, .sheet-head'); if (!h || e.target.closest('button')) return;
    sheet = h.closest('.sheet'); y0 = e.touches[0].clientY; sheet.classList.add('is-dragging');
  }, { passive: true });
  document.addEventListener('touchmove', e => { if (y0 === null) return; const d = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${d}px)`; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (y0 === null) return; const d = e.changedTouches[0].clientY - y0; sheet.classList.remove('is-dragging');
    if (d > 90) closeSheet(); else sheet.style.transform = '';
    y0 = null; sheet = null;
  });
})();

/* الشيت بيتحرك (slide up) أول مرة يتفتح بس.
   لما بنحدّث اللي جواه (اختيار، علامة، حالة) بيفضل ثابت مكانه ومن غير ما يرجع لأول السكرول */
(() => {
  const box = $('sheet'); let wasOpen = false, lastScroll = 0;
  document.addEventListener('scroll', e => { if (e.target.classList && e.target.classList.contains('sheet')) lastScroll = e.target.scrollTop; }, true);
  new MutationObserver(() => {
    const sh = box.querySelector('.sheet');
    if (!sh) { wasOpen = false; lastScroll = 0; return; }
    if (wasOpen) {
      box.querySelectorAll('.sheet, .backdrop').forEach(el => el.classList.add('no-anim'));
      sh.scrollTop = lastScroll;
    }
    wasOpen = true;
  }).observe(box, { childList: true });
})();

// الكيبورد على الآيفون: بنعرف إنه مفتوح من الخانة اللي عليها الـ focus
(() => {
  const isField = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') && !['checkbox','radio','button'].includes(el.type);
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (visualViewport.height > innerHeight - 80) window.scrollTo(0, 0); });
  document.addEventListener('focusin', e => { if (isField(e.target)) document.body.classList.add('kb-open'); });
  document.addEventListener('focusout', () => setTimeout(() => {
    if (isField(document.activeElement)) return;      // انتقلت لخانة تانية، الكيبورد لسه مفتوح
    document.body.classList.remove('kb-open');
    window.scrollTo(0, 0);   // الصفحة نفسها لازم تفضل عند الصفر؛ لو الآيفون زحزحها وقت الكيبورد بنرجّعها
  }, 80));
})();

S = load();
renewLists();
render();
dailyReminders();

if ('serviceWorker' in navigator && location.hostname.endsWith('github.io')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
